<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国债期货技术面</title>
  <link rel="preload" href="./echarts.min.js" as="script">
  <link rel="preload" href="./data.js" as="script">
  <script src="./echarts.min.js" async></script>
  <style>
    :root {
      --ink: #10140f;
      --pine: #1a241c;
      --paper: #f1e6cf;
      --rule: #cbb992;
      --vermilion: #c43c2c;
      --moss: #2f6b4f;
      --amber: #d7a04b;
      --mute: #7a715f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0d110e; color: var(--paper); }
    body {
      font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
      background-image:
        radial-gradient(1000px 420px at 8% -8%, #243028 0%, transparent 55%),
        linear-gradient(180deg, #141a16, #0d110e);
    }
    .frame { max-width: 1080px; margin: 0 auto; padding: 24px 18px 56px; }
    header {
      display: flex; justify-content: space-between; gap: 16px; align-items: end;
      border-bottom: 1px solid rgba(241,230,207,.18); padding-bottom: 16px;
    }
    .kicker { font-family: "IBM Plex Mono", monospace; letter-spacing: .2em; font-size: 11px; color: var(--amber); }
    h1 { font-family: "Fraunces", "Noto Serif SC", serif; font-size: clamp(28px, 5vw, 46px); margin: 6px 0 0; letter-spacing: -.03em; }
    .asof { font-family: "IBM Plex Mono", monospace; font-size: 13px; text-align: right; }
    .asof b { display: block; font-family: "Fraunces", serif; font-size: 22px; color: #fff; }
    .banner {
      margin: 16px 0 12px; padding: 12px 14px;
      background: rgba(215,160,75,.1); border: 1px solid rgba(215,160,75,.28);
      color: #f0dfb8; font-size: 14px; line-height: 1.7;
      overflow: visible;
    }
    .view {
      background: var(--paper); color: var(--ink); padding: 16px 18px 14px;
      box-shadow: 8px 12px 0 rgba(0,0,0,.28); margin: 0 0 22px;
    }
    .view h2 { margin: 0 0 8px; font-size: 20px; }
    .view .body { font-size: 15px; line-height: 1.8; margin: 0 0 10px; overflow-wrap: break-word; white-space: pre-wrap; }
    .view .risk {
      border: 1px solid rgba(196,60,44,.35); background: rgba(196,60,44,.08);
      padding: 8px 10px; font-size: 13px; line-height: 1.75;
      overflow-wrap: break-word;
    }
    .ind { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
    .ind span {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      border: 1px solid var(--rule); padding: 2px 7px; color: #3d382c;
    }
    .card {
      background: var(--paper); color: var(--ink); padding: 16px 16px 12px;
      box-shadow: 8px 12px 0 rgba(0,0,0,.28); margin-bottom: 22px;
    }
    .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .code { font-family: "IBM Plex Mono", monospace; color: var(--mute); font-size: 12px; }
    .name { margin: 0; font-size: 22px; }
    .px { font-family: "Fraunces", serif; font-size: 34px; letter-spacing: -.04em; }
    .stamp { display: inline-block; border: 2px solid var(--vermilion); color: var(--vermilion); font-weight: 700; padding: 1px 8px; transform: rotate(-7deg); margin-right: 8px; }
    .stamp.mid { border-color: #8a5a22; color: #8a5a22; }
    .meta { font-size: 14px; line-height: 1.55; }
    .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-family: "IBM Plex Mono", monospace; font-size: 12px; margin: 8px 0 10px; }
    .levels span { color: var(--mute); }
    .tools, .layers { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; align-items: center; }
    .tools button, .layers button {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      border: 1px solid var(--rule); background: transparent; padding: 3px 8px; cursor: pointer;
    }
    .tools button.on, .layers button.on { background: var(--ink); color: var(--paper); }
    .layers button.solo { background: var(--vermilion); color: #fff; border-color: var(--vermilion); }
    .layers .hint { font-size: 11px; color: var(--mute); }
    .chart { height: 680px; width: 100%; position: relative; }
    .chart:empty::before {
      content: "正在画图…";
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #6d6454; font-size: 13px;
    }
    .note { font-size: 12px; color: #6d6454; margin: 6px 0 0; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--mute); margin-top: 8px; min-height: 18px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend .sw { width: 14px; height: 3px; display: inline-block; }
    .legend .sw.dash { height: 0; border-top: 2px dashed; background: none !important; width: 16px; }
    .legend .sw.band { height: 8px; width: 12px; opacity: .55; }
    .hist h2 { font-size: 18px; }
    .rail { display: flex; gap: 10px; overflow-x: auto; }
    .pill { min-width: 168px; background: var(--pine); border: 1px solid rgba(241,230,207,.16); padding: 10px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    .pill .d { color: var(--amber); }
    footer { margin-top: 24px; color: var(--mute); font-size: 12px; font-family: "IBM Plex Mono", monospace; line-height: 1.6; }
    @media (max-width: 720px) {
      header, .head { display: block; }
      .asof { text-align: left; margin-top: 8px; }
      .chart { height: 620px; }
      .levels { font-size: 11px; }
      .px { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <div>
        <div class="kicker">CGB Futures Desk</div>
        <h1>国债期货技术面</h1>
      </div>
      <div class="asof"><b id="asof">—</b><div id="source"></div></div>
    </header>
    <div class="banner" id="banner">正在加载结论…</div>
    <section class="view" id="view"><p>正在写入交易视角…</p></section>
    <article class="card" id="card-T"><p class="meta">正在写入 T 结论…</p></article>
    <article class="card" id="card-TL"><p class="meta">正在写入 TL 结论…</p></article>
    <section class="hist">
      <h2>连续变化</h2>
      <div class="rail" id="rail"></div>
    </section>
    <footer id="foot"></footer>
  </div>
  <script src="./data.js"></script>
  <script>
    const D = window.DESK;
    if (!D) {
      document.getElementById("banner").textContent =
        "data.js 没有加载到。请打开同目录下的 index.html，不要只打开编辑器预览。";
    } else {
    const fmt = (n, d) => Number(n).toFixed(d);
    const rng = (a, d) => `${fmt(a[0], d)}–${fmt(a[1], d)}`;
    document.getElementById("asof").textContent = D.asof;
    document.getElementById("source").textContent = `${D.source} · ${D.codes.T} / ${D.codes.TL}`;
    document.getElementById("banner").textContent =
      `近20日 T ${D.curve.t_pct > 0 ? "+" : ""}${D.curve.t_pct}% ，TL ${D.curve.tl_pct > 0 ? "+" : ""}${D.curve.tl_pct}% 。${D.curve.note}`;
    const V = D.view || {};
    document.getElementById("view").innerHTML = V.body
      ? `<h2>现状判断：${V.title || ""}</h2><p class="body">${V.body}</p><div class="risk">⚠ ${V.risk || ""}</div>`
      : `<h2>现状判断</h2><p class="body">本页还没有现状判断。</p>`;

    function chips(spec) {
      const ind = spec.indicators;
      if (!ind) return "";
      const macd = ind.macd || {};
      const rsi = ind.rsi || {};
      const kdj = ind.kdj || {};
      const items = [
        ind.candle,
        `MACD ${macd.hist_state || ""}${macd.cross ? " · " + macd.cross : ""}`,
        rsi.value != null ? `RSI ${rsi.value} ${rsi.zone}` : "",
        kdj.state ? `KDJ ${kdj.state}` : "",
        ind.vs_ma10 ? `价在MA10${ind.vs_ma10}` : "",
        ind.boll && ind.boll.pos ? `BOLL ${ind.boll.pos}` : ""
      ].filter(Boolean);
      return `<div class="ind">${items.map(x => `<span>${x}</span>`).join("")}</div>`;
    }

    function card(key, spec) {
      const d = key === "TL" ? 2 : 3;
      return `
        <div class="head">
          <div><div class="code">${spec.code}</div><h2 class="name">${spec.name}</h2></div>
          <div class="px">${fmt(spec.close, d)}</div>
        </div>
        <div><span class="stamp">${spec.bias}</span><span class="stamp mid">把握${spec.confidence}</span></div>
        <p class="meta">${spec.pattern}。${spec.pattern_note}</p>
        ${chips(spec)}
        <div class="levels">
          <div><span>这波失效</span><br>${fmt(spec.invalid_near, d)}</div>
          <div><span>大方向失效</span><br>${fmt(spec.invalid_trend, d)}</div>
          <div><span>近端支撑</span><br>${rng(spec.support_near, d)}</div>
          <div><span>远端支撑</span><br>${rng(spec.support_far, d)}</div>
          <div><span>近端压力</span><br>${rng(spec.resist_near, d)}</div>
          <div><span>远端压力</span><br>${rng(spec.resist_far, d)}</div>
        </div>
        <div class="tools" data-key="${key}">
          <button class="on" data-n="60">3月</button>
          <button data-n="120">6月</button>
          <button data-n="250">1年</button>
          <button data-n="9999">全部</button>
        </div>
        <div class="layers" data-key="${key}">
          <button class="on" data-layer="maS" title="MA10 / MA20">短均</button>
          <button data-layer="maL" title="MA60 / MA120">长均</button>
          <button class="on" data-layer="ch" title="波段高低点连线，不是均线">通道</button>
          <button class="on" data-layer="band" title="近端支撑 / 压力色带">色带</button>
          <button class="on" data-layer="inv" title="这波失效 / 大方向失效">失效</button>
          <span class="hint">单击开关 · 双击只看这层</span>
        </div>
        <div class="chart" id="ch-${key}"></div>
        <p class="note">${spec.oi_note || ""}</p>
        <div class="legend" id="lg-${key}"></div>`;
    }
    document.getElementById("card-T").innerHTML = card("T", D.T);
    document.getElementById("card-TL").innerHTML = card("TL", D.TL);

    const charts = {};
    const observers = {};
    const rangeN = { T: 60, TL: 60 };
    const clickWait = {};
    const C = {
      ma10: "#0e7c7b",
      ma20: "#3b6ea5",
      ma60: "#6b4ea1",
      ma120: "#d97706",
      ch: "#9a3412",
      invN: "#8a1f16",
      invT: "#57534e",
      bandS: "rgba(47,107,79,.22)",
      bandR: "rgba(196,60,44,.18)",
      bandSF: "rgba(47,107,79,.10)"
    };
    const defaultLayers = () => ({ maS: true, maL: false, ch: true, band: true, inv: true, solo: null });
    const layers = { T: defaultLayers(), TL: defaultLayers() };

    function layerOn(key, name) {
      const L = layers[key];
      if (L.solo) return L.solo === name;
      return !!L[name];
    }
    function paintLayerButtons(key) {
      const box = document.querySelector(`.layers[data-key="${key}"]`);
      if (!box) return;
      const L = layers[key];
      box.querySelectorAll("button[data-layer]").forEach(btn => {
        const name = btn.dataset.layer;
        btn.classList.toggle("solo", L.solo === name);
        btn.classList.toggle("on", L.solo ? L.solo === name : !!L[name]);
      });
    }
    function legendHtml(key) {
      const item = (cls, color, label) => {
        const style = cls.includes("dash")
          ? `border-color:${color}`
          : `background:${color}`;
        return `<span><i class="sw ${cls}" style="${style}"></i>${label}</span>`;
      };
      const out = [];
      if (layerOn(key, "band")) {
        out.push(item("band", "#2f6b4f", "近端支撑带"));
        out.push(item("band", "#c43c2c", "近端压力带"));
      }
      if (layerOn(key, "ch")) {
        out.push(item("", C.ch, "通道下沿"));
        out.push(item("dash", C.ch, "通道上沿"));
      }
      if (layerOn(key, "maS")) {
        out.push(item("", C.ma10, "MA10"));
        out.push(item("", C.ma20, "MA20"));
      }
      if (layerOn(key, "maL")) {
        out.push(item("", C.ma60, "MA60"));
        out.push(item("", C.ma120, "MA120"));
      }
      if (layerOn(key, "inv")) {
        out.push(item("", C.invN, "这波失效"));
        out.push(item("dash", C.invT, "大方向失效"));
      }
      return out.join("");
    }
    function slice(bars, n) { return n >= bars.length ? bars : bars.slice(-n); }
    function extendLine(p1, p2, dates) {
      if (!p1 || !p2 || dates.length < 2) return [];
      const x1 = new Date(p1[0]).getTime(), x2 = new Date(p2[0]).getTime();
      if (x2 === x1) return [];
      const slope = (p2[1] - p1[1]) / (x2 - x1);
      return dates.map(d => {
        const x = new Date(d).getTime();
        return +(p1[1] + slope * (x - x1)).toFixed(4);
      });
    }

    function draw(key, n) {
      if (!window.echarts) return;
      if (n) rangeN[key] = n;
      n = rangeN[key];
      paintLayerButtons(key);
      const lg = document.getElementById("lg-" + key);
      if (lg) lg.innerHTML = legendHtml(key);
      const spec = D[key];
      const dec = key === "TL" ? 2 : 3;
      const bars = slice(spec.bars, n);
      const dates = bars.map(b => b.time);
      const candle = bars.map(b => [b.open, b.close, b.low, b.high]);
      const vol = bars.map(b => ({
        value: b.volume,
        itemStyle: { color: b.close >= b.open ? "rgba(196,60,44,.45)" : "rgba(47,107,79,.45)" }
      }));
      const oiMap = Object.fromEntries((spec.oi || []).map(p => [p.time, p.value]));
      const oi = dates.map(d => oiMap[d] ?? null);
      const ma = (f) => bars.map(b => b[f]);
      const area = (lo, hi, color, name) => ([
        { yAxis: lo, itemStyle: { color }, name },
        { yAxis: hi }
      ]);
      const showInv = layerOn(key, "inv");
      const showBand = layerOn(key, "band");
      const showCh = layerOn(key, "ch");
      const showMaS = layerOn(key, "maS");
      const showMaL = layerOn(key, "maL");
      const markLine = showInv ? [
        {
          name: "这波失效",
          yAxis: spec.invalid_near,
          label: { formatter: "这波失效 {c}", position: "insideStartTop", color: C.invN },
          lineStyle: { color: C.invN, width: 1.5, type: "solid" }
        },
        {
          name: "大方向失效",
          yAxis: spec.invalid_trend,
          label: { formatter: "大方向失效 {c}", position: "insideStartBottom", color: C.invT },
          lineStyle: { color: C.invT, width: 1, type: "dashed" }
        }
      ] : [];
      const bandData = showBand ? [
        area(spec.support_near[0], spec.support_near[1], C.bandS, "近撑"),
        area(spec.resist_near[0], spec.resist_near[1], C.bandR, "近压"),
        area(spec.support_far[0], spec.support_far[1], C.bandSF, "远撑")
      ] : [];
      const trendSeries = [];
      if (showCh && spec.trend_lower) {
        trendSeries.push({
          name: "通道下沿", type: "line", xAxisIndex: 0, yAxisIndex: 0,
          data: extendLine(spec.trend_lower[0], spec.trend_lower[1], dates),
          showSymbol: false, lineStyle: { color: C.ch, width: 2 },
          tooltip: { show: false }
        });
      }
      if (showCh && spec.trend_upper) {
        trendSeries.push({
          name: "通道上沿", type: "line", xAxisIndex: 0, yAxisIndex: 0,
          data: extendLine(spec.trend_upper[0], spec.trend_upper[1], dates),
          showSymbol: false, lineStyle: { color: C.ch, width: 2, type: "dashed" },
          tooltip: { show: false }
        });
      }

      const el = document.getElementById("ch-" + key);
      if (charts[key]) charts[key].dispose();
      const chart = echarts.init(el, null, { renderer: "canvas" });
      chart.setOption({
        animation: false,
        backgroundColor: "#f1e6cf",
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "cross" },
          backgroundColor: "#201c16",
          borderWidth: 0,
          textStyle: { color: "#f1e6cf", fontSize: 12 },
          formatter(params) {
            const p = params.filter(x => x.seriesName === "K线")[0];
            if (!p) return "";
            const i = p.dataIndex;
            const b = bars[i];
            const oiV = oi[i];
            const macd = b.macd_hist != null ? `<br>MACD柱 ${Number(b.macd_hist).toFixed(4)}` : "";
            const rsi = b.rsi != null ? `  RSI ${Number(b.rsi).toFixed(1)}` : "";
            return `${b.time}<br>开 ${b.open}  高 ${b.high}<br>低 ${b.low}  收 ${b.close}<br>成交量 ${Math.round(b.volume)} 手`
              + (oiV != null ? `<br>持仓 ${Math.round(oiV)} 手` : "")
              + macd + rsi;
          }
        },
        axisPointer: { link: [{ xAxisIndex: [0, 1, 2, 3] }] },
        grid: [
          { left: 56, right: 18, top: 24, height: 268 },
          { left: 56, right: 18, top: 306, height: 78 },
          { left: 56, right: 18, top: 398, height: 62 },
          { left: 56, right: 18, top: 474, height: 82 }
        ],
        xAxis: [
          { type: "category", data: dates, gridIndex: 0, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#cbb992" } } },
          { type: "category", data: dates, gridIndex: 1, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#cbb992" } } },
          { type: "category", data: dates, gridIndex: 2, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#cbb992" } } },
          { type: "category", data: dates, gridIndex: 3, axisLabel: { color: "#6d6454", fontSize: 10, hideOverlap: true }, axisLine: { lineStyle: { color: "#cbb992" } } }
        ],
        yAxis: [
          { scale: true, gridIndex: 0, splitNumber: 5, axisLabel: { color: "#3d382c", fontFamily: "IBM Plex Mono", fontSize: 11, formatter: v => v.toFixed(dec) }, splitLine: { lineStyle: { color: "rgba(16,20,15,.08)" } } },
          { scale: true, gridIndex: 1, splitNumber: 3, axisLabel: { color: "#6d6454", fontSize: 10 }, splitLine: { show: false }, name: "MACD", nameTextStyle: { color: "#6d6454", fontSize: 11 } },
          { min: 0, scale: false, gridIndex: 2, splitNumber: 2, axisLabel: { color: "#6d6454", fontSize: 10, formatter: v => (v/1000).toFixed(0) + "千" }, splitLine: { show: false }, name: "量", nameTextStyle: { color: "#6d6454", fontSize: 10 } },
          { scale: true, gridIndex: 3, splitNumber: 3, axisLabel: { color: "#6d6454", fontSize: 10, formatter: v => (v/10000).toFixed(1) + "万" }, splitLine: { show: false }, name: "仓", nameTextStyle: { color: "#6d6454", fontSize: 10 } }
        ],
        series: [
          {
            name: "K线", type: "candlestick", data: candle, xAxisIndex: 0, yAxisIndex: 0,
            itemStyle: { color: "#c43c2c", color0: "#2f6b4f", borderColor: "#c43c2c", borderColor0: "#2f6b4f" },
            markArea: { silent: true, data: bandData },
            markLine: { symbol: "none", data: markLine }
          },
          { name: "MA10", type: "line", data: ma("ma10"), xAxisIndex: 0, yAxisIndex: 0, show: showMaS, showSymbol: false, lineStyle: { color: C.ma10, width: 1.6 } },
          { name: "MA20", type: "line", data: ma("ma20"), xAxisIndex: 0, yAxisIndex: 0, show: showMaS, showSymbol: false, lineStyle: { color: C.ma20, width: 1.8 } },
          { name: "MA60", type: "line", data: ma("ma60"), xAxisIndex: 0, yAxisIndex: 0, show: showMaL, showSymbol: false, lineStyle: { color: C.ma60, width: 1.3 } },
          { name: "MA120", type: "line", data: ma("ma120"), xAxisIndex: 0, yAxisIndex: 0, show: showMaL, showSymbol: false, lineStyle: { color: C.ma120, width: 1.3 } },
          ...trendSeries,
          {
            name: "MACD柱", type: "bar", data: bars.map(b => ({
              value: b.macd_hist,
              itemStyle: { color: (b.macd_hist || 0) >= 0 ? "rgba(196,60,44,.55)" : "rgba(47,107,79,.55)" }
            })),
            xAxisIndex: 1, yAxisIndex: 1, barWidth: "60%"
          },
          { name: "DIF", type: "line", data: ma("dif"), xAxisIndex: 1, yAxisIndex: 1, showSymbol: false, lineStyle: { color: "#3b6ea5", width: 1 } },
          { name: "DEA", type: "line", data: ma("dea"), xAxisIndex: 1, yAxisIndex: 1, showSymbol: false, lineStyle: { color: "#8a5a22", width: 1 } },
          { name: "成交量", type: "bar", data: vol, xAxisIndex: 2, yAxisIndex: 2, barWidth: "60%" },
          {
            name: "持仓", type: "line", data: oi, xAxisIndex: 3, yAxisIndex: 3,
            showSymbol: false, connectNulls: false, lineStyle: { color: "#8a5a22", width: 2 },
            areaStyle: { color: "rgba(138,90,34,.12)" },
            markArea: D.roll_start ? {
              silent: true,
              itemStyle: { color: "rgba(196,60,44,.12)" },
              data: [[{ xAxis: D.roll_start, name: "换月" }, { xAxis: dates[dates.length - 1] }]]
            } : undefined
          }
        ]
      });
      if (observers[key]) observers[key].disconnect();
      observers[key] = new ResizeObserver(() => chart.resize());
      observers[key].observe(el);
      charts[key] = chart;
    }

    document.querySelectorAll(".tools").forEach(box => {
      box.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        box.querySelectorAll("button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        draw(box.dataset.key, Number(btn.dataset.n));
      });
    });
    document.querySelectorAll(".layers").forEach(box => {
      const key = box.dataset.key;
      box.addEventListener("click", e => {
        const btn = e.target.closest("button[data-layer]");
        if (!btn) return;
        const name = btn.dataset.layer;
        clearTimeout(clickWait[key]);
        clickWait[key] = setTimeout(() => {
          const L = layers[key];
          if (L.solo) L.solo = null;
          else L[name] = !L[name];
          draw(key);
        }, 220);
      });
      box.addEventListener("dblclick", e => {
        const btn = e.target.closest("button[data-layer]");
        if (!btn) return;
        e.preventDefault();
        clearTimeout(clickWait[key]);
        const L = layers[key];
        const name = btn.dataset.layer;
        L.solo = L.solo === name ? null : name;
        draw(key);
      });
    });
    const rail = document.getElementById("rail");
    (D.history || []).slice().reverse().forEach(h => {
      const el = document.createElement("div");
      el.className = "pill";
      el.innerHTML = `<div class="d">${h.asof}</div>T ${h.T.bias}/${h.T.confidence} ${h.T.close}<br>TL ${h.TL.bias}/${h.TL.confidence} ${h.TL.close}`;
      rail.appendChild(el);
    });
    document.getElementById("foot").textContent =
      `${D.roll_note} 数据来源于万得 Wind 金融数据服务。`;

    function bootCharts() {
      if (!window.echarts) {
        document.getElementById("foot").textContent = "图表库 echarts.min.js 未加载，结论文字仍可用。";
        return;
      }
      try { draw("T", 60); draw("TL", 60); }
      catch (err) { document.getElementById("foot").textContent = "画图失败：" + err.message; }
    }
    if (window.echarts) {
      bootCharts();
    } else {
      const existing = document.querySelector('script[src*="echarts.min.js"]');
      const fail = () => {
        document.getElementById("foot").textContent = "图表库 echarts.min.js 未加载，结论文字仍可用。";
      };
      if (existing && existing.readyState === "complete") {
        fail();
      } else if (existing) {
        existing.addEventListener("load", bootCharts);
        existing.addEventListener("error", fail);
      } else {
        const s = document.createElement("script");
        s.src = "./echarts.min.js";
        s.addEventListener("load", bootCharts);
        s.addEventListener("error", fail);
        document.body.appendChild(s);
      }
    }
    } // end DESK present
  </script>
</body>
</html>
