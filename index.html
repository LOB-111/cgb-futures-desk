<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国债期货技术面</title>
  <link rel="preload" href="./echarts.min.js" as="script">
  <link rel="preload" href="./data.js" as="script">
  <script src="./echarts.min.js" async></script>
  <style>
    :root {
      --page-bg: #F5F7FA;
      --surface: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --up: #DC2626;
      --up-soft: #FEF2F2;
      --up-border: #FECACA;
      --down: #059669;
      --down-soft: #ECFDF5;
      --down-border: #A7F3D0;
      --warning: #B7791F;
      --warning-soft: #FFFBEB;
      --warning-border: #FDE68A;
      --neutral: #475569;
      --neutral-soft: #F1F5F9;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--page-bg); color: var(--text-primary); }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", "Inter", "IBM Plex Sans", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .frame { max-width: 1440px; margin: 0 auto; padding: 24px 32px 40px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      min-height: 48px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -.02em;
      color: var(--text-primary); line-height: 1.2;
    }
    .contract-tabs {
      display: flex; flex-wrap: nowrap; gap: 0; align-items: stretch;
      border-bottom: 1px solid var(--border); margin: 0 0 16px; overflow-x: auto;
    }
    .contract-tab {
      appearance: none; background: transparent; border: 0;
      border-bottom: 2px solid transparent; color: var(--text-muted);
      font: inherit; font-size: 14px; font-weight: 500; letter-spacing: .02em;
      padding: 8px 16px 10px; margin-bottom: -1px; cursor: pointer;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0; white-space: nowrap;
    }
    .contract-tab:hover { color: var(--text-secondary); }
    .contract-tab[aria-selected="true"] {
      color: var(--text-primary); background: var(--surface);
      border-bottom-color: var(--text-primary);
    }
    .contract-panel { display: none; }
    .contract-panel.active { display: block; }
    .asof {
      text-align: right; font-size: 12px; font-weight: 500; color: var(--text-muted);
      flex-shrink: 0;
    }
    .asof b {
      display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary);
      margin-top: 2px;
    }
    .mkt-status {
      display: inline-block; margin-top: 4px;
      padding: 2px 8px; border-radius: var(--radius-sm);
      background: var(--neutral-soft); color: var(--text-secondary);
      font-size: 12px; font-weight: 500; height: 22px; line-height: 18px;
    }
    .banner {
      margin: 0 0 16px; padding: 12px 16px;
      background: var(--warning-soft); border: 1px solid var(--warning-border);
      border-radius: var(--radius-md); color: var(--warning);
      font-size: 14px; line-height: 1.6;
    }
    .view {
      background: var(--surface); color: var(--text-primary);
      padding: 16px 20px; border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
      margin: 0 0 16px;
    }
    .view .body { font-size: 14px; line-height: 1.7; margin: 0; color: var(--text-secondary); }
    .product { margin-bottom: 8px; }
    .card {
      background: transparent; color: var(--text-primary);
      padding: 0; border: 0; box-shadow: none; margin-bottom: 24px;
    }
    .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 16px; }
    .code { color: var(--text-muted); font-size: 12px; font-weight: 500; letter-spacing: .04em; }
    .name { margin: 2px 0 0; font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .px { font-size: 18px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .core {
      position: relative; margin: 0 0 16px; padding: 20px 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    }
    .core-head { font-size: 24px; line-height: 1.3; font-weight: 600; margin: 0 0 12px; color: var(--text-primary); }
    .core-line {
      display: grid; grid-template-columns: 72px 1fr;
      font-size: 14px; line-height: 1.55; color: var(--text-primary);
      min-height: 28px; align-items: baseline;
    }
    .core-line .k { color: var(--text-secondary); font-weight: 400; }
    .erole { color: var(--text-muted); font-weight: 500; }
    .core-reason {
      margin: -2px 0 8px 72px; font-size: 13px; line-height: 1.45;
      color: var(--text-secondary);
    }
    .change-stamp { color: var(--text-muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
    .core-history { margin-top: 4px; }
    .core-history > summary { border-top: 0; padding-top: 8px; }
    .layer-k {
      font-size: 16px; font-weight: 600; color: var(--text-primary);
      margin: 0 0 12px;
    }
    .tag, .conf-tag {
      display: inline-flex; align-items: center;
      height: 24px; padding: 2px 8px; border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 500; white-space: nowrap;
      background: var(--warning-soft); color: var(--warning);
      border: 1px solid var(--warning-border);
    }
    .tag.up, .conf-tag.bull { background: var(--up-soft); color: var(--up); border-color: var(--up-border); }
    .tag.down, .conf-tag.bear { background: var(--down-soft); color: var(--down); border-color: var(--down-border); }
    .tag.warn, .conf-tag.gold { background: var(--warning-soft); color: var(--warning); border-color: var(--warning-border); }
    .tag.neutral { background: var(--neutral-soft); color: var(--neutral); border-color: var(--border); }
    .decision-grid {
      display: grid; grid-template-columns: 2fr 3fr; gap: 16px; margin-bottom: 16px;
    }
    .event-card {
      margin: 0; padding: 20px 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    }
    .event-card .fval { margin-bottom: 8px; }
    .event-note { font-size: 13px; color: var(--text-secondary); margin-top: 10px; line-height: 1.55; }
    .drows { margin-top: 4px; }
    .drow {
      display: grid; grid-template-columns: 108px 1fr;
      min-height: 38px; align-items: center;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .drow:last-child { border-bottom: 0; }
    .drow-k { color: var(--text-secondary); font-weight: 400; }
    .drow-v { color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums; }
    .drow.warn .drow-v {
      color: var(--warning); font-weight: 600;
      background: var(--warning-soft); border: 1px solid var(--warning-border);
      border-radius: var(--radius-sm); padding: 2px 8px; justify-self: start;
    }
    .drow.strong .drow-v { font-weight: 600; }
    .pathgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pathcol { padding: 14px; border-radius: var(--radius-md); min-height: 100%; }
    .pathcol.up { background: var(--up-soft); border: 1px solid var(--up-border); }
    .pathcol.down { background: var(--down-soft); border: 1px solid var(--down-border); }
    .path-k { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
    .pathcol.up > .path-k { color: var(--up); }
    .pathcol.down > .path-k { color: var(--down); }
    .path-step {
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--surface); border-radius: var(--radius-sm);
      padding: 10px 12px; margin-bottom: 8px;
      font-size: 14px; line-height: 1.55; color: var(--text-primary);
    }
    .path-step:last-child { margin-bottom: 0; }
    .path-step b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .path-step.arrow { color: var(--text-secondary); }
    .step-num {
      flex: 0 0 20px; width: 20px; height: 20px; margin-top: 1px;
      border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500; line-height: 1;
    }
    .pathcol.up .step-num { background: var(--up); color: #fff; }
    .pathcol.down .step-num { background: var(--down); color: #fff; }
    .step-body { flex: 1; min-width: 0; }
    .step-out { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
    .path-step[title] { cursor: help; }
    .evidence-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0;
    }
    .evidence-card {
      padding: 16px 20px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-md);
    }
    .evidence-head {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .evidence-card .ed { font-size: 13px; line-height: 1.55; color: var(--text-secondary); margin-top: 6px; }
    .aux-evidence { display: grid; gap: 8px; margin: 0 0 12px; }
    .aux-bar {
      display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
      padding: 10px 14px; background: var(--surface-subtle);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font-size: 13px; line-height: 1.55; color: var(--text-primary);
    }
    .aux-bar .aux-k { font-weight: 600; color: var(--text-primary); }
    .aux-bar .aux-sep { color: var(--text-muted); margin: 0 6px; font-weight: 400; }
    .aux-bar .aux-digest { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .aux-row { font-size: 13px; line-height: 1.55; color: var(--text-primary); padding: 4px 0; }
    .aux-row b { margin-right: 8px; }
    .aux-row .more { color: var(--text-muted); font-size: 12px; }
    details.fold { margin: 0 0 4px; font-size: 13px; color: var(--text-secondary); }
    details.fold summary {
      cursor: pointer; color: var(--text-secondary); font-weight: 500; font-size: 13px;
      list-style: none; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-top: 1px solid var(--border);
    }
    details.fold summary::-webkit-details-marker { display: none; }
    details.fold summary::after { content: "▸"; color: var(--text-muted); font-size: 12px; }
    details.fold[open] summary::after { content: "▾"; }
    details.fold .more { padding: 4px 0 8px; color: var(--text-secondary); line-height: 1.6; }
    .flab { font-size: 16px; font-weight: 600; color: var(--text-primary); letter-spacing: 0; margin: 0; }
    .core > .flab { font-size: 16px; margin-bottom: 8px; }
    .fval { font-size: 18px; line-height: 1.35; font-weight: 600; color: var(--text-primary); }
    .pwindow { display: block; margin-top: 6px; color: var(--text-muted); font-size: 13px; font-weight: 400; line-height: 1.45; }
    .shape-summary-status { margin-top: 6px; }
    .transition-summary { color: var(--warning); }
    .indicator-event-notice { margin-top: 4px; color: var(--warning); font-size: 13px; line-height: 1.45; }
    .fzone { font-size: 13px; color: var(--warning); margin-top: 4px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .block {
      margin: 0 0 16px; padding: 20px 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    }
    .block-k {
      font-size: 16px; font-weight: 600; color: var(--text-primary);
      margin: 0 0 12px; padding: 0; border-top: 0;
    }
    .fbound { margin-top: 6px; font-size: 12px; line-height: 1.45; }
    .ftrig { margin-right: 8px; font-weight: 600; color: var(--text-primary); }
    .fpx { font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .pathcell { border: 1px solid transparent; padding: 8px 8px 10px; margin-bottom: 6px; }
    .pathcell.sup { background: var(--up-soft); }
    .pathcell.res { background: var(--down-soft); }
    .pathcell.focus { outline: 1px solid var(--warning); background: var(--warning-soft); }
    .pathcell.attention {
      border-color: var(--warning-border); border-left: 3px solid var(--warning); padding-left: 8px;
    }
    .pathcell.attention .pz { font-weight: 600; }
    .attention-tag {
      margin-left: auto; font-size: 12px; font-weight: 500;
      color: var(--warning); border: 1px solid var(--warning-border);
      padding: 2px 8px; border-radius: var(--radius-sm); background: var(--warning-soft);
    }
    .pathcell.empty { color: var(--text-muted); font-size: 13px; }
    .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .htag { font-size: 12px; color: var(--text-muted); padding: 0; }
    .pathcell.sup .role, .pathcell.sup .pz { color: var(--up); }
    .pathcell.res .role, .pathcell.res .pz { color: var(--down); }
    .role { font-size: 12px; }
    .pz { font-size: 16px; font-weight: 600; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
    .pa { font-size: 13px; color: var(--text-secondary); }
    .composite {
      margin: 2px 0 14px; padding: 10px 12px;
      border: 1px solid var(--border); background: var(--surface-subtle);
      border-radius: var(--radius-md);
    }
    .composite .fval { margin-bottom: 6px; }
    .composite-setup, .composite-path, .composite-inv { font-size: 13px; line-height: 1.65; color: var(--text-secondary); margin-top: 4px; }
    .flow-tags, .flow-note, .flow-judge { font-size: 13px; line-height: 1.6; color: var(--text-secondary); padding: 0 12px 4px; }
    .flow-judge { font-weight: 600; padding-bottom: 8px; color: var(--text-primary); }
    .focus-card b { color: var(--text-primary); }
    .composite b { margin-right: 6px; }
    .struct-state {
      margin: 2px 0 12px; padding: 8px 10px;
      background: var(--surface-subtle); color: var(--text-secondary);
      font-size: 13px; line-height: 1.55; border-radius: var(--radius-sm);
    }
    .bull { color: var(--up); }
    .bear { color: var(--down); }
    .neutral { color: var(--neutral); }
    .gold { color: var(--warning); }
    .confirm { margin: 0 0 14px; }
    .confirm .row {
      display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
      padding: 10px 12px; margin: 0 0 6px; font-size: 14px; line-height: 1.6;
    }
    .confirm .row:last-child { margin: 0; }
    .confirm .row.dir { background: var(--neutral-soft); }
    .confirm .row.dir.bear { background: var(--down-soft); }
    .confirm .row.dir.bull { background: var(--up-soft); }
    .confirm .row.env { background: var(--warning-soft); }
    .kind { color: var(--text-muted); font-size: 12px; min-width: 56px; }
    .badge { font-weight: 600; min-width: 72px; flex: 0 0 auto; }
    .indline { display: flex; flex-wrap: wrap; gap: 6px 0; align-items: center; }
    .indline span { font-size: 12px; margin-right: 4px; font-weight: 400; font-variant-numeric: tabular-nums; }
    .evidence { margin: 8px 0 0; font-size: 12px; color: var(--text-muted); }
    .tools, .layers { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; align-items: center; }
    .tools button, .layers button {
      font-size: 12px; font-weight: 500; font-family: inherit;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); padding: 4px 10px;
      border-radius: var(--radius-sm); cursor: pointer;
    }
    .tools button.on, .layers button.on {
      background: var(--text-primary); color: var(--surface); border-color: var(--text-primary);
    }
    .layers button.solo { background: var(--up); color: #fff; border-color: var(--up); }
    .layers .hint { font-size: 12px; color: var(--text-muted); }
    .chart { height: 740px; width: 100%; position: relative; background: var(--surface); }
    .chart:empty::before {
      content: "正在画图…";
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 13px;
    }
    .note { font-size: 13px; color: var(--text-muted); margin: 6px 0 0; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--text-muted); margin-top: 8px; min-height: 18px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend .sw { width: 14px; height: 3px; display: inline-block; }
    .legend .sw.dash { height: 0; border-top: 2px dashed; background: none !important; width: 16px; }
    .legend .sw.band { height: 8px; width: 12px; opacity: .55; }
    .hist {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
      padding: 8px 24px 16px; margin-bottom: 16px;
    }
    .hist > details.fold > summary { border-top: 0; }
    .hist h2 { font-size: 16px; font-weight: 600; margin: 8px 0 12px; }
    .rail { display: flex; gap: 10px; overflow-x: auto; }
    .pill {
      min-width: 220px; background: var(--surface-subtle);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 10px 12px; font-size: 12px; line-height: 1.55; color: var(--text-secondary);
    }
    .pill .d { color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
    footer { margin-top: 8px; color: var(--text-muted); font-size: 12px; line-height: 1.6; }
    @media (max-width: 1199px) {
      .decision-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 767px) {
      .frame { padding: 16px 16px 32px; }
      header { min-height: 0; padding: 8px 0 4px; }
      .contract-tabs { margin-bottom: 12px; }
      .contract-tab { padding: 8px 14px 10px; }
      .head { display: block; }
      .pathgrid, .evidence-grid { grid-template-columns: 1fr; }
      .core-reason { margin-left: 0; }
      .chart { height: 680px; }
      h1 { font-size: 22px; }
      .core-head { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <h1>国债期货技术面</h1>
      <div class="asof">
        更新时间
        <b id="asof">—</b>
        <div><span class="mkt-status" id="source"></span></div>
      </div>
    </header>
    <div class="contract-tabs" role="tablist" aria-label="合约">
      <button type="button" class="contract-tab" role="tab" id="tab-TL" data-contract="TL" aria-controls="card-TL" aria-selected="true">TL</button>
      <button type="button" class="contract-tab" role="tab" id="tab-T" data-contract="T" aria-controls="card-T" aria-selected="false" tabindex="-1">T</button>
    </div>
    <div class="banner" id="banner">正在加载结论…</div>
    <article class="card product contract-panel" id="card-T" role="tabpanel" aria-labelledby="tab-T"><p class="note">正在写入 T 结论…</p></article>
    <article class="card product contract-panel active" id="card-TL" role="tabpanel" aria-labelledby="tab-TL"><p class="note">正在写入 TL 结论…</p></article>
    <section class="view" id="view" hidden></section>
    <section class="hist">
      <details class="fold">
        <summary>历史状态</summary>
        <h2>连续变化</h2>
        <div class="rail" id="rail"></div>
      </details>
    </section>
    <footer id="foot"></footer>
  </div>
  <script src="./data.js"></script>
  <script>
    const D = window.DESK;
    if (!D) {
      document.getElementById("banner").textContent =
        "data.js 没有加载到。请打开同目录下的 index.html，不要只打开编辑器预览。";
    } else {
    const fmt = (n, d) => Number(n).toFixed(d);
    document.getElementById("asof").textContent = D.asof;
    document.getElementById("source").textContent = `${D.source} · 日线已收盘`;
    document.getElementById("banner").style.display = "none";
    const cross = (D.cross_events || []).filter(Boolean);
    const view = document.getElementById("view");
    if (cross.length) {
      view.hidden = false;
      view.innerHTML = `<p class="body"><b>跨品种观察：</b>${cross.join(" ")}</p>`;
    } else {
      view.hidden = true;
      view.innerHTML = "";
    }

    function attrEscape(text) {
      return String(text || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }
    function mdStamp(date) {
      if (!date) return "";
      const parts = String(date).slice(5).split("-");
      if (parts.length < 2) return "";
      return `${Number(parts[0])}/${Number(parts[1])}更新`;
    }
    function changeStamp(show, date) {
      if (!show || !date) return "";
      return ` <span class="change-stamp">${mdStamp(date)}</span>`;
    }
    function coreHeadline(spec) {
      const j = spec.composite_judgement || {};
      const bar = spec.status_bar || {};
      const short = j.short_bias || "";
      const medium = (spec.market_structure || {}).bias;
      if (bar.composite) return bar.composite;
      if (short && medium) return `短线${short} · 中期${medium}背景`;
      return j.headline || "";
    }
    function paintBias(text) {
      return String(text || "")
        .replace(/偏多|向上突破|上涨/g, '<span class="bull">$&</span>')
        .replace(/偏空|向下突破|下跌/g, '<span class="bear">$&</span>');
    }
    function toneTag(tone) {
      if (tone === "bull") return "up";
      if (tone === "bear") return "down";
      if (tone === "gold") return "warn";
      return "neutral";
    }
    function coreBlock(spec) {
      const structure = spec.market_structure || {};
      const event = spec.current_event || {};
      const bar = spec.status_bar || {};
      const confLine = bar.event_confidence || bar.confirmation_status || "";
      const stageLine = event.stage_text || bar.event_stage || event.state || "";
      const reasonTip = attrEscape(structure.reason_detail || "");
      const records = [
        spec.direction_transition_state && spec.direction_transition_state.summary,
        spec.shape_transition_state && spec.shape_transition_state.summary,
        spec.focus_transition_state && spec.focus_transition_state.summary,
      ].filter((item, i, arr) => item && arr.indexOf(item) === i);
      const fold = records.length
        ? `<details class="fold core-history"><summary>状态变化记录</summary><div class="more">${records.join("<br>")}</div></details>`
        : "";
      return `<div class="core">
        <div class="flab">核心判断</div>
        <div class="core-head">${paintBias(coreHeadline(spec))}</div>
        <div class="core-line core-structure"${reasonTip ? ` title="${reasonTip}"` : ""}><span class="k">市场结构</span><span class="v">${structure.label || ""}${changeStamp(structure.show_change, structure.last_changed_at)}</span></div>
        ${structure.reason ? `<div class="core-reason"${reasonTip ? ` title="${reasonTip}"` : ""}>${structure.reason}</div>` : ""}
        <div class="core-line core-event"><span class="k">当前事件</span><span class="v">${event.label || ""}${changeStamp(event.show_change, event.last_changed_at)}</span></div>
        <div class="core-line core-stage"><span class="k">事件阶段</span><span class="v">${stageLine}</span></div>
        <div class="core-line core-confirm"><span class="k">事件确认</span><span class="v">${confLine}${changeStamp(bar.confirm_show_change, bar.confirm_changed_at)}</span></div>
        ${fold}
      </div>`;
    }
    function drow(label, value, extra) {
      if (value == null || value === "") return "";
      return `<div class="drow${extra ? " " + extra : ""}"><span class="drow-k">${label}</span><span class="drow-v">${value}</span></div>`;
    }
    function eventCard(spec) {
      const card = spec.event_card || spec.focus_card || {};
      const close = card.close ? `<span class="px">${card.close}</span>` : "";
      return `<div class="event-card focus-card">
        <div class="flab">当前事件</div>
        <div class="drows">
          ${drow("事件区间", card.event_zone || card.key_zone)}
          ${drow("当前价格", close)}
          ${drow("下一判定", card.next_gate, "warn")}
        </div>
      </div>`;
    }
    function pathSteps(items) {
      if (!items || !items.length) return `<div class="path-step">等待可验证条件</div>`;
      return items.map((item, i) => {
        if (typeof item === "string") {
          return `<div class="path-step"><span class="step-num">${i + 1}</span><div class="step-body">${item}</div></div>`;
        }
        const price = item.price
          ? (item.role ? `<b>${item.price}｜${item.role}</b>` : `<b>${item.price}</b>`)
          : "";
        const qualifier = item.qualifier ? " " + item.qualifier : "";
        const line = `${item.action || ""} ${price}${qualifier}${item.outcome ? " → " + item.outcome : ""}`.replace(/\s+/g, " ").trim();
        const attr = item.title ? ` title="${attrEscape(item.title)}"` : "";
        return `<div class="path-step"${attr}><span class="step-num">${i + 1}</span><div class="step-body">${line}</div></div>`;
      }).join("");
    }
    function eventPaths(spec) {
      const raw = spec.event_paths || {};
      return `<div class="pathgrid">
        <section class="pathcol up">
          <b class="path-k">上行路径</b>
          ${pathSteps(raw.up)}
        </section>
        <section class="pathcol down">
          <b class="path-k">下行路径</b>
          ${pathSteps(raw.down)}
        </section>
      </div>`;
    }
    function evidenceCard(view, extra) {
      if (!view) throw new Error("missing evidence card view");
      const rows = (view.rows || []).map(row => drow(row.k, row.v, row.extra)).join("");
      const conditions = (view.conditions || []).map(line => `<div class="ed">${line}</div>`).join("");
      const role = view.role ? `<span class="erole">｜${view.role}</span>` : "";
      return `<div class="evidence-card">
        <div class="evidence-head">
          <div class="flab">${view.title}${role}</div>
          <span class="tag ${toneTag(view.tone)}">${view.headline || ""}</span>
        </div>
        <div class="drows">${rows}</div>
        ${conditions}
        ${extra || ""}
      </div>`;
    }
    function evidenceGrid(spec) {
      const c = spec.confirmation || {};
      const divergence = spec.macd_divergence || {};
      const notices = spec.indicator_event_notices || [];
      const extraInd = divergence.active_for_verdict
        ? `<div class="ed">${[divergence.event_label, divergence.status_label].filter(Boolean).join(" · ")}</div>`
        : (notices.length ? `<div class="indicator-event-notice">${notices.join("　")}</div>` : "");
      return `<div class="evidence-grid">
        ${evidenceCard((c.intraday_15m || {}).view)}
        ${evidenceCard((c.volume_oi || {}).view)}
        ${evidenceCard((c.indicators || {}).view, extraInd)}
        ${evidenceCard((c.volatility || {}).view)}
      </div>`;
    }
    function moreLevels(spec) {
      const lines = spec.more_levels || [];
      if (!lines.length) return "";
      return `<details class="fold"><summary>更多价格位</summary>${lines.join("<br>")}</details>`;
    }
    function card(key, spec) {
      const focus = spec.display_focus;
      if (!focus) throw new Error("missing display_focus");
      if (!spec.display_summary) throw new Error("missing display_summary");
      if (!spec.market_structure || !spec.current_event || !spec.event_card || !spec.event_paths || !spec.confirmation) {
        throw new Error("missing five-layer desk view");
      }
      return `
        <div class="head">
          <div><div class="code">${spec.code}</div><h2 class="name">${spec.name}</h2></div>
        </div>
        ${coreBlock(spec)}
        <div class="layer-k">事件与路径</div>
        <div class="decision-grid">
          ${eventCard(spec)}
          ${eventPaths(spec)}
        </div>
        <div class="block">
          <div class="block-k">确认证据</div>
          ${evidenceGrid(spec)}
          ${moreLevels(spec)}
        </div>
        <div class="block">
        <div class="block-k">图表</div>
        <div class="tools" data-key="${key}">
          <button class="on" data-n="60">3月</button>
          <button data-n="120">6月</button>
          <button data-n="250">1年</button>
          <button data-n="9999">全部</button>
        </div>
        <div class="layers" data-key="${key}">
          <button class="on" data-layer="maS" title="MA10 / MA20">短均</button>
          <button data-layer="maL" title="MA60 / MA120">长均</button>
          <button class="on" data-layer="ref" title="通道与失效边界参考线">参考线</button>
          <button class="on" data-layer="band" title="近端支撑 / 压力色带">色带</button>
          <span class="hint">单击开关 · 双击只看这层</span>
        </div>
        <div class="chart" id="ch-${key}"></div>
        <div class="legend" id="lg-${key}"></div>
        </div>`;
    }
    document.getElementById("card-T").innerHTML = card("T", D.T);
    document.getElementById("card-TL").innerHTML = card("TL", D.TL);
    const charts = {};

    function readContract() {
      return new URLSearchParams(location.search).get("contract") === "T" ? "T" : "TL";
    }
    function resizeActiveChart(key) {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { charts[key]?.resize(); });
      });
    }
    function syncHistory(key) {
      document.querySelectorAll(".hist-block").forEach(el => {
        el.hidden = el.dataset.contract !== key;
      });
      document.querySelectorAll(".hist .pill").forEach(pill => {
        pill.hidden = ![...pill.querySelectorAll(".hist-block")].some(block => !block.hidden);
      });
    }
    function setActiveContract(key, updateUrl) {
      const active = key === "T" ? "T" : "TL";
      document.getElementById("card-T").classList.toggle("active", active === "T");
      document.getElementById("card-TL").classList.toggle("active", active === "TL");
      document.querySelectorAll(".contract-tab").forEach(tab => {
        const on = tab.dataset.contract === active;
        tab.setAttribute("aria-selected", on ? "true" : "false");
        tab.tabIndex = on ? 0 : -1;
      });
      syncHistory(active);
      if (updateUrl) {
        const url = new URL(location.href);
        url.searchParams.set("contract", active);
        history.replaceState({ contract: active }, "", url);
      }
      resizeActiveChart(active);
    }
    document.querySelector(".contract-tabs").addEventListener("click", e => {
      const tab = e.target.closest(".contract-tab");
      if (!tab) return;
      setActiveContract(tab.dataset.contract, true);
    });
    document.querySelector(".contract-tabs").addEventListener("keydown", e => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const tabs = [...document.querySelectorAll(".contract-tab")];
      const i = tabs.findIndex(tab => tab.getAttribute("aria-selected") === "true");
      const next = tabs[(i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
      next.focus();
      setActiveContract(next.dataset.contract, true);
      e.preventDefault();
    });
    setActiveContract(readContract(), false);

    const observers = {};
    const rangeN = { T: 60, TL: 60 };
    const clickWait = {};
    const C = {
      ma10: "#0e7c7b",
      ma20: "#3b6ea5",
      ma60: "#6b4ea1",
      ma120: "#d97706",
      ch: "rgba(71,85,105,.82)",
      invN: "rgba(183,121,31,.78)",
      invT: "rgba(15,23,42,.72)",
      bandS: "rgba(220,38,38,.08)",
      bandR: "rgba(5,150,105,.08)",
      bandSF: "rgba(220,38,38,.16)",
      bandRF: "rgba(5,150,105,.16)",
      structS: "rgba(220,38,38,.48)",
      structR: "rgba(5,150,105,.48)",
      former: "rgba(253,230,138,.35)",
      formerLine: "rgba(183,121,31,.72)",
      primary: "rgba(254,202,202,.55)",
      dense: "rgba(148,163,184,.12)"
    };
    const defaultLayers = () => ({ maS: true, maL: false, ref: true, band: true, solo: null });
    const layers = { T: defaultLayers(), TL: defaultLayers() };

    function layerOn(key, name) {
      const L = layers[key];
      if (L.solo) return L.solo === name;
      return !!L[name];
    }
    function paintLayerButtons(key) {
      const box = document.querySelector(`.layers[data-key="${key}"]`);
      if (!box) return;
      const L = layers[key];
      box.querySelectorAll("button[data-layer]").forEach(btn => {
        const name = btn.dataset.layer;
        btn.classList.toggle("solo", L.solo === name);
        btn.classList.toggle("on", L.solo ? L.solo === name : !!L[name]);
      });
    }
    function nums(xs) {
      return xs.filter(v => v != null && v !== "" && !Number.isNaN(+v)).map(v => +v);
    }
    function shapeBoundaryYs(spec) {
      const ys = [];
      if (spec.shape_boundary_type === "two_sided") {
        if (spec.shape_boundary_lower != null) ys.push(+spec.shape_boundary_lower);
        if (spec.shape_boundary_upper != null) ys.push(+spec.shape_boundary_upper);
      } else if (spec.invalid_near != null) {
        ys.push(+spec.invalid_near);
      } else {
        if (spec.shape_boundary_lower != null) ys.push(+spec.shape_boundary_lower);
        if (spec.shape_boundary_upper != null) ys.push(+spec.shape_boundary_upper);
      }
      return nums(ys);
    }
    function railPrices(rail) {
      if (!Array.isArray(rail)) return [];
      return nums(rail.map(p => Array.isArray(p) ? p[1] : null));
    }
    function legendHtml(key) {
      const item = (cls, color, label) => {
        const style = cls.includes("dash")
          ? `border-color:${color}`
          : `background:${color}`;
        return `<span><i class="sw ${cls}" style="${style}"></i>${label}</span>`;
      };
      const spec = D[key];
      const out = [];
      if (layerOn(key, "band")) {
        out.push(item("band", "rgba(220,38,38,.45)", "近端支撑带"));
        out.push(item("band", "rgba(220,38,38,.22)", "结构支撑区"));
        out.push(item("band", "rgba(5,150,105,.45)", "近端压力带"));
        out.push(item("band", "rgba(5,150,105,.22)", "结构压力区"));
      }
      if (layerOn(key, "ref")) {
        if (spec.trend_lower) out.push(item("dash", C.ch, "通道下沿"));
        if (spec.trend_upper) out.push(item("dash", C.ch, "通道上沿"));
        if (shapeBoundaryYs(spec).length) out.push(item("dash", C.invN, "形态边界"));
        if ((spec.direction_state || {}).direction_boundary != null) out.push(item("dash", C.invT, "方向失效"));
      }
      if (layerOn(key, "maS")) {
        out.push(item("", C.ma10, "MA10"));
        out.push(item("", C.ma20, "MA20"));
      }
      if (layerOn(key, "maL")) {
        out.push(item("", C.ma60, "MA60"));
        out.push(item("", C.ma120, "MA120"));
      }
      return out.join("");
    }
    function slice(bars, n) { return n >= bars.length ? bars : bars.slice(-n); }
    function railSeriesData(rail, dates) {
      if (!Array.isArray(rail) || rail.length < 2 || !dates.length) return [];
      const byDate = {};
      rail.forEach(point => {
        if (point && point[0] != null && point[1] != null) byDate[point[0]] = +point[1];
      });
      return dates.map(d => (d in byDate && !Number.isNaN(byDate[d]) ? byDate[d] : null));
    }

    function draw(key, n) {
      if (!window.echarts) return;
      if (n) rangeN[key] = n;
      n = rangeN[key];
      paintLayerButtons(key);
      const lg = document.getElementById("lg-" + key);
      if (lg) lg.innerHTML = legendHtml(key);
      const spec = D[key];
      const dec = key === "TL" ? 2 : 3;
      const bars = slice(spec.bars, n);
      const focusBars = bars.slice(-Math.min(40, bars.length));
      // All daily display paths must remain in the price domain.  In particular,
      // a remote path can sit outside the last 40 candles but is still a visible
      // support/resistance zone, not merely an off-screen reference.
      const displayZones = ["support", "resistance"]
        .map(side => {
          const display = spec.display_levels || {};
          return (display.display_paths && display.display_paths[side]) || display[side] || [];
        })
        .flatMap(levels => (levels || []).map(level => level.zone));
      const coreZones = Object.values(spec.price_path || {}).filter(Boolean).flatMap(x => x.zone).concat(displayZones);
      const shapeLines = shapeBoundaryYs(spec);
      const priceVals = nums(focusBars.flatMap(b => [b.low, b.high]).concat(coreZones));
      const nativeMin = Math.min(...priceVals);
      const nativeMax = Math.max(...priceVals);
      const atr = focusBars[focusBars.length - 1]?.atr || (nativeMax - nativeMin) * 0.12;
      const atrPad = atr * 0.5;
      const refLevels = [];
      if (layerOn(key, "ref")) {
        refLevels.push(...shapeLines);
        if ((spec.direction_state || {}).direction_boundary != null) refLevels.push(+((spec.direction_state || {}).direction_boundary));
        refLevels.push(...railPrices(spec.trend_lower), ...railPrices(spec.trend_upper));
      }
      // Keep nearby invalidation / channel rails in frame; far levels get an edge caption instead of crushing the scale.
      const cap = Math.max(4 * atr, (nativeMax - nativeMin) * 0.75);
      const nearbyRef = nums(refLevels).filter(y => y >= nativeMin - cap && y <= nativeMax + cap);
      const focusValues = priceVals.concat(nearbyRef);
      const focusMin = Math.min(...focusValues);
      const focusMax = Math.max(...focusValues);
      const priceMin = focusMin - atrPad;
      const priceMax = focusMax + atrPad;
      const dates = bars.map(b => b.time);
      const candle = bars.map(b => [b.open, b.close, b.low, b.high]);
      const vol = bars.map(b => ({
        value: b.volume,
        itemStyle: { color: b.close >= b.open ? "rgba(220,38,38,.45)" : "rgba(5,150,105,.45)" }
      }));
      const oiMap = Object.fromEntries((spec.oi || []).map(p => [p.time, p.value]));
      const oi = dates.map(d => oiMap[d] ?? null);
      const ma = (f) => bars.map(b => b[f]);
      const area = (lo, hi, color, name, labelColor, side) => ([
        {
          yAxis: lo,
          itemStyle: { color },
          name,
          label: {
            show: Boolean(name),
            position: side || "insideLeft",
            distance: 6,
            color: labelColor || "#0F172A",
            fontSize: 10,
            fontFamily: "IBM Plex Sans, Inter, sans-serif"
          }
        },
        { yAxis: hi }
      ]);
      const edge = (y, color, name, position, style = {}) => ({
        yAxis: y,
        lineStyle: { color, width: style.width || 1.3, type: style.type || "solid" },
        label: name ? { show: true, formatter: name, position: position || "insideEnd", color, fontSize: 10, distance: 4 } : { show: false }
      });
      const showInv = layerOn(key, "ref");
      const showBand = layerOn(key, "band");
      const showCh = layerOn(key, "ref");
      const showMaS = layerOn(key, "maS");
      const showMaL = layerOn(key, "maL");
      const markLine = [];
      const offscreen = [];
      const bandData = [];
      if (showBand) {
        const display = spec.display_levels;
        const pathSet = (display && display.display_paths) || display || {};
        if (!display || !Array.isArray(pathSet.support) || !Array.isArray(pathSet.resistance)) {
          throw new Error("missing display_levels support/resistance");
        }
        const addDisplayBand = (level, color, lineColor, tag, labelColor, labelPosition) => {
          const z = level.zone;
          const primary = level.chart_visual_level === "primary";
          const remote = level.chart_visual_level === "remote";
          const reversalWatch = String(level.chart_role || "").startsWith("reversal_watch_");
          // Every path remains a zone on the chart. Remote levels use the
          // stronger far-zone tint so they remain legible without masquerading
          // as the active primary observation.
          const bandColor = reversalWatch ? C.former : primary ? C.primary : remote
            ? (level.chart_role === "support" ? C.bandSF : C.bandRF)
            : color;
          bandData.push(area(z[0], z[1], bandColor, "", labelColor, "insideLeft"));
          const lineStyle = {
            width: reversalWatch ? 1.0 : primary ? 2.2 : remote ? 0.8 : 1.3,
            type: reversalWatch ? "dashed" : "solid"
          };
          // Zones are drawn with both borders; boundary_to_draw remains only a semantic event field.
          const labelAtLower = level.boundary_to_draw === "lower";
          markLine.push(edge(z[0], lineColor, level.chart_show_label && labelAtLower ? tag : null, labelPosition, lineStyle));
          markLine.push(edge(z[1], lineColor, level.chart_show_label && !labelAtLower ? tag : null, labelPosition, lineStyle));
        };
        ((display.chart_visual_plan || {}).dense_clusters || []).forEach(cluster => {
          bandData.push(area(cluster.zone[0], cluster.zone[1], C.dense, "", "#475569", "insideLeft"));
        });
        const chartPaths = { support: pathSet.support, resistance: pathSet.resistance };
        (chartPaths.support || []).forEach((level, i) => addDisplayBand(level, C.bandS, C.structS, level.chart_label, "#DC2626", i % 2 ? "insideEndTop" : "insideStartBottom"));
        (chartPaths.resistance || []).forEach((level, i) => addDisplayBand(level, C.bandR, C.structR, level.chart_label, "#059669", i % 2 ? "insideStartTop" : "insideEndBottom"));
        (display.former || []).forEach(level => addDisplayBand(level, C.former, C.formerLine, level.chart_label, "#B7791F", "insideEndTop"));
      }
      const patName = spec.pattern_label;
      if (!patName) throw new Error("missing pattern_label");
      const mid = zone => zone && zone.length === 2 ? (+zone[0] + +zone[1]) / 2 : null;
      const refShort = (side, label) => {
        if (/待确认|进入观察|首次/.test(label || "")) return `${side}·待确认`;
        if (/失败/.test(label || "")) return `${side}·失败`;
        if (/已测试/.test(label || "")) return `${side}·已测试`;
        return side;
      };
      const candidates = [];
      const queueLine = (name, y, color, width, tip, priority, labelPosition) => {
        if (y == null || Number.isNaN(+y)) return;
        y = +y;
        if (y >= priceMin && y <= priceMax) {
          candidates.push({ name, y, color, width, tip, priority, labelPosition });
        } else {
          offscreen.push({ name, y, color, below: y < priceMin });
        }
      };
      if (showInv) {
        const refs = spec.structure_levels || {};
        const same = (a, b) => a && b && +a[0] === +b[0] && +a[1] === +b[1];
        const refS = refs.support_reference;
        const refR = refs.resistance_reference;
        const formerZones = ((spec.display_levels || {}).former || []).map(x => x.zone);
        const isFormer = zone => formerZones.some(item => same(item, zone));
        if (refS && !same(refS.zone, spec.daily_price_path?.support_structure?.zone) && !isFormer(refS.zone)) {
          queueLine(refShort("原撑", refS.label), mid(refS.zone), C.structS, refS.displaced ? 0.8 : 1.15, "原结构支撑仅用于阶段跌破确认，不作为当前下行路径。", 1, "insideStart");
        }
        if (refR && !same(refR.zone, spec.daily_price_path?.resistance_structure?.zone) && !isFormer(refR.zone)) {
          queueLine(refShort("原压", refR.label), mid(refR.zone), C.structR, refR.displaced ? 0.8 : 1.15, "原结构压力仅用于阶段突破确认，不作为当前上行路径。", 1, "insideStart");
        }
        shapeLines.forEach(y => {
          queueLine("形态边界", y, C.invN, 1.3, `形态边界 ${fmt(y, dec)}<br>当前形态：${patName}`, 3);
        });
        const directionBoundary = (spec.direction_state || {}).direction_boundary;
        if (directionBoundary != null) {
          queueLine(
            "方向失效", directionBoundary, C.invT, 1.5,
            `方向失效 ${fmt(directionBoundary, dec)}<br>当前中期方向：${spec.bias}`, 3
          );
        }
      }
      const minGap = Math.max(atr * 0.45, (priceMax - priceMin) * 0.055);
      const placed = [];
      candidates.slice().sort((a, b) => b.priority - a.priority || b.y - a.y).forEach(item => {
        const clash = placed.find(k => Math.abs(k.y - item.y) < minGap);
        if (clash) {
          if (item.priority < clash.priority) return;
          if (item.priority === clash.priority && Math.abs(clash.y - item.y) < minGap * 0.5) return;
          item.position = item.y >= clash.y ? "insideEndTop" : "insideEndBottom";
          clash.position = item.y >= clash.y ? "insideEndBottom" : "insideEndTop";
        }
        item.position = item.position || "insideEnd";
        placed.push(item);
      });
      placed.forEach(item => {
        markLine.push({
          name: item.name,
          yAxis: item.y,
          label: {
            formatter: item.name,
            position: item.labelPosition || item.position || "insideEnd",
            color: item.color,
            fontSize: 10,
            distance: 4
          },
          lineStyle: { color: item.color, width: item.width, type: "dashed" },
          tooltip: { formatter: item.tip }
        });
      });
      const railSeries = (name, rail) => ({
        name, type: "line", xAxisIndex: 0, yAxisIndex: 0, clip: true, z: 8,
        data: railSeriesData(rail, dates),
        showSymbol: false,
        lineStyle: { color: C.ch, width: 1.8, type: "dashed" },
        endLabel: { show: false },
        label: { show: false },
        tooltip: { show: false }
      });
      const trendSeries = [];
      if (showCh && spec.trend_lower) trendSeries.push(railSeries("通道下沿", spec.trend_lower));
      if (showCh && spec.trend_upper) trendSeries.push(railSeries("通道上沿", spec.trend_upper));

      const el = document.getElementById("ch-" + key);
      if (charts[key]) charts[key].dispose();
      const chart = echarts.init(el, null, { renderer: "svg" });
      const plotLeft = 68;
      const plotRight = 52;
      const gPrice = { left: plotLeft, right: plotRight, top: 20, height: 300, containLabel: false };
      const gMacd = { left: plotLeft, right: plotRight, top: 360, height: 90, containLabel: false };
      const gVol = { left: plotLeft, right: plotRight, top: 472, height: 70, containLabel: false };
      const gOi = { left: plotLeft, right: plotRight, top: 564, height: 82, containLabel: false };
      chart.setOption({
        animation: false,
        backgroundColor: "#FFFFFF",
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "cross" },
          backgroundColor: "#0F172A",
          borderWidth: 0,
          textStyle: { color: "#F8FAFC", fontSize: 12 },
          formatter(params) {
            const p = params.filter(x => x.seriesName === "K线")[0];
            if (!p) return "";
            const i = p.dataIndex;
            const b = bars[i];
            const oiV = oi[i];
            const macd = b.macd_hist != null ? `<br>MACD柱 ${Number(b.macd_hist).toFixed(4)}` : "";
            const rsi = b.rsi != null ? `  RSI ${Number(b.rsi).toFixed(1)}` : "";
            const kdj = b.k != null && b.d != null
              ? `<br>KDJ ${Number(b.k).toFixed(1)} / ${Number(b.d).toFixed(1)} / ${Number(b.j).toFixed(1)}${b.k < b.d ? " 偏弱" : b.k > b.d ? " 偏强" : ""}`
              : "";
            const boll = b.boll_state
              ? `<br>布林 ${b.boll_state}${b.boll_pct != null ? ` 分位${b.boll_pct}%` : ""}`
              : "";
            return `${b.time}<br>开 ${b.open}  高 ${b.high}<br>低 ${b.low}  收 ${b.close}<br>成交量 ${Math.round(b.volume)} 手`
              + (oiV != null ? `<br>持仓 ${Math.round(oiV)} 手` : "")
              + macd + rsi + kdj + boll;
          }
        },
        axisPointer: { link: [{ xAxisIndex: [0, 1, 2, 3] }] },
        graphic: [
          { type: "text", left: plotLeft + 4, top: gMacd.top + 2, style: { text: "MACD", fill: "#94A3B8", fontSize: 11, fontFamily: "IBM Plex Sans, Inter, sans-serif" } },
          { type: "text", left: plotLeft + 4, top: gVol.top + 2, style: { text: "成交量", fill: "#94A3B8", fontSize: 11, fontFamily: "IBM Plex Sans, Inter, sans-serif" } },
          { type: "text", left: plotLeft + 4, top: gOi.top + 2, style: { text: "持仓量", fill: "#94A3B8", fontSize: 11, fontFamily: "IBM Plex Sans, Inter, sans-serif" } },
          ...offscreen.map((item, i) => ({
            type: "text",
            left: plotLeft + 8,
            top: item.below
              ? gPrice.top + gPrice.height - 16 - i * 14
              : gPrice.top + 4 + i * 14,
            style: {
              text: `${item.name} ${fmt(item.y, dec)} ${item.below ? "↓" : "↑"}`,
              fill: item.color,
              fontSize: 11,
              fontFamily: "IBM Plex Sans, Inter, sans-serif",
              fontWeight: 600
            }
          }))
        ],
        grid: [gPrice, gMacd, gVol, gOi],
        xAxis: [
          { type: "category", data: dates, gridIndex: 0, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#E2E8F0" } } },
          { type: "category", data: dates, gridIndex: 1, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#E2E8F0" } } },
          { type: "category", data: dates, gridIndex: 2, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#E2E8F0" } } },
          { type: "category", data: dates, gridIndex: 3, axisLabel: { color: "#94A3B8", fontSize: 10, hideOverlap: true }, axisLine: { lineStyle: { color: "#E2E8F0" } } }
        ],
        yAxis: [
          { min: priceMin, max: priceMax, gridIndex: 0, splitNumber: 5, axisLabel: { color: "#475569", fontFamily: "IBM Plex Sans, Inter, sans-serif", fontSize: 10, align: "right", margin: 8, formatter: v => v.toFixed(dec) }, splitLine: { lineStyle: { color: "rgba(15,23,42,.06)" } } },
          { scale: true, gridIndex: 1, splitNumber: 3, axisLabel: { color: "#94A3B8", fontFamily: "IBM Plex Sans, Inter, sans-serif", fontSize: 10, align: "right", margin: 8 }, splitLine: { show: false } },
          { min: 0, scale: false, gridIndex: 2, splitNumber: 2, axisLabel: { color: "#94A3B8", fontFamily: "IBM Plex Sans, Inter, sans-serif", fontSize: 10, align: "right", margin: 8, formatter: v => (v/1000).toFixed(0) + "千" }, splitLine: { show: false } },
          { scale: true, gridIndex: 3, splitNumber: 3, axisLabel: { color: "#94A3B8", fontFamily: "IBM Plex Sans, Inter, sans-serif", fontSize: 10, align: "right", margin: 8, formatter: v => (v/10000).toFixed(1) + "万" }, splitLine: { show: false } }
        ],
        series: [
          {
            name: "K线", type: "candlestick", data: candle, xAxisIndex: 0, yAxisIndex: 0, clip: true,
            itemStyle: { color: "#DC2626", color0: "#059669", borderColor: "#DC2626", borderColor0: "#059669" },
            markArea: {
              silent: true,
              label: { show: true, position: "insideLeft" },
              data: bandData
            },
            markLine: { symbol: "none", silent: true, data: markLine }
          },
          ...(showMaS ? [
            { name: "MA10", type: "line", data: ma("ma10"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma10, width: 1.6 } },
            { name: "MA20", type: "line", data: ma("ma20"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma20, width: 1.8 } }
          ] : []),
          ...(showMaL ? [
            { name: "MA60", type: "line", data: ma("ma60"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma60, width: 1.3 } },
            { name: "MA120", type: "line", data: ma("ma120"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma120, width: 1.3 } }
          ] : []),
          ...trendSeries,
          {
            name: "MACD柱", type: "bar", data: bars.map(b => ({
              value: b.macd_hist,
              itemStyle: { color: (b.macd_hist || 0) >= 0 ? "rgba(220,38,38,.55)" : "rgba(5,150,105,.55)" }
            })),
            xAxisIndex: 1, yAxisIndex: 1, barWidth: "60%"
          },
          { name: "DIF", type: "line", data: ma("dif"), xAxisIndex: 1, yAxisIndex: 1, showSymbol: false, lineStyle: { color: "#3b6ea5", width: 1 } },
          { name: "DEA", type: "line", data: ma("dea"), xAxisIndex: 1, yAxisIndex: 1, showSymbol: false, lineStyle: { color: "#64748B", width: 1 } },
          { name: "成交量", type: "bar", data: vol, xAxisIndex: 2, yAxisIndex: 2, barWidth: "60%" },
          {
            name: "持仓", type: "line", data: oi, xAxisIndex: 3, yAxisIndex: 3,
            showSymbol: false, connectNulls: false, lineStyle: { color: "#475569", width: 2 },
            areaStyle: { color: "rgba(71,85,105,.10)" },
            markArea: D.roll_start ? {
              silent: true,
              itemStyle: { color: "rgba(220,38,38,.10)" },
              data: [[{ xAxis: D.roll_start, name: "换月" }, { xAxis: dates[dates.length - 1] }]]
            } : undefined
          }
        ]
      }, { notMerge: true });
      if (observers[key]) observers[key].disconnect();
      observers[key] = new ResizeObserver(() => chart.resize());
      observers[key].observe(el);
      charts[key] = chart;
    }

    document.querySelectorAll(".tools").forEach(box => {
      box.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        box.querySelectorAll("button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        draw(box.dataset.key, Number(btn.dataset.n));
      });
    });
    document.querySelectorAll(".layers").forEach(box => {
      const key = box.dataset.key;
      box.addEventListener("click", e => {
        const btn = e.target.closest("button[data-layer]");
        if (!btn) return;
        const name = btn.dataset.layer;
        clearTimeout(clickWait[key]);
        clickWait[key] = setTimeout(() => {
          const L = layers[key];
          if (L.solo) L.solo = null;
          else L[name] = !L[name];
          draw(key);
        }, 220);
      });
      box.addEventListener("dblclick", e => {
        const btn = e.target.closest("button[data-layer]");
        if (!btn) return;
        e.preventDefault();
        clearTimeout(clickWait[key]);
        const L = layers[key];
        const name = btn.dataset.layer;
        L.solo = L.solo === name ? null : name;
        draw(key);
      });
    });

    function md(asof) {
      const p = String(asof).split("-");
      return p.length === 3 ? `${p[1]}/${p[2]}` : asof;
    }
    function layerName(spec) {
      if (!spec.pattern_label) throw new Error("missing pattern_label");
      return spec.pattern_label;
    }
    function histLines(prev, cur, key) {
      if (!cur) return [];
      const lines = [];
      const add = (name, a, b) => {
        if (b == null || b === "" || a == null || a === "") return;
        if (String(a) !== String(b)) lines.push(`${name}：${a} → ${b}`);
      };
      add("中期方向", prev && prev.bias, cur.bias);
      add("运行形态", prev && layerName(prev), layerName(cur));
      add("当前事件", prev && prev.event, cur.event);
      add("事件阶段", prev && prev.event_stage, cur.event_stage);
      add("当前焦点", prev && prev.focus, cur.focus);
      add("辅助确认", prev && prev.verdict, cur.verdict);
      add("波动状态", prev && prev.volatility, cur.volatility);
      return lines;
    }
    const rail = document.getElementById("rail");
    const history = D.history || [];
    history.slice().reverse().forEach((h, i, arr) => {
      const prev = arr[i + 1];
      const blocks = ["T", "TL"].map(key => {
        const lines = histLines(prev && prev[key], h[key], key);
        if (!lines.length) return "";
        const recal = h[key] && h[key].state_change_reason === "roll_recalibration";
        const oldContract = prev && prev[key] && prev[key].analysis_contract;
        const newContract = h[key] && h[key].analysis_contract;
        const contractText = oldContract || newContract
          ? `（${oldContract || "原序列"} → ${newContract || "未知合约"}）`
          : "";
        const reason = recal ? ` · 换月重估${contractText}` : " · 市场事件";
        return `<div class="hist-block" data-contract="${key}"><div class="d">${md(h.asof)} ${key}${reason}</div>${lines.join("<br>")}</div>`;
      }).filter(Boolean);
      if (!blocks.length) return;
      const el = document.createElement("div");
      el.className = "pill";
      el.innerHTML = blocks.join("<br>");
      rail.appendChild(el);
    });
    if (!rail.children.length) {
      rail.textContent = "尚无层级变化可显示。";
    }
    syncHistory(readContract());
    document.getElementById("foot").textContent =
      `${D.roll_note} 数据来源于万得 Wind 金融数据服务。`;

    function bootCharts() {
      if (!window.echarts) {
        document.getElementById("foot").textContent = "图表库 echarts.min.js 未加载，结论文字仍可用。";
        return;
      }
      try {
        draw("T", 60);
        draw("TL", 60);
        resizeActiveChart(readContract());
      }
      catch (err) { document.getElementById("foot").textContent = "画图失败：" + err.message; }
    }
    if (window.echarts) {
      bootCharts();
    } else {
      const existing = document.querySelector('script[src*="echarts.min.js"]');
      const fail = () => {
        document.getElementById("foot").textContent = "图表库 echarts.min.js 未加载，结论文字仍可用。";
      };
      if (existing && existing.readyState === "complete") {
        fail();
      } else if (existing) {
        existing.addEventListener("load", bootCharts);
        existing.addEventListener("error", fail);
      } else {
        const s = document.createElement("script");
        s.src = "./echarts.min.js";
        s.addEventListener("load", bootCharts);
        s.addEventListener("error", fail);
        document.body.appendChild(s);
      }
    }
    } // end DESK present
  </script>
</body>
</html>
