<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国债期货技术面</title>
  <link rel="preload" href="./echarts.min.js" as="script">
  <link rel="preload" href="./data.js" as="script">
  <script src="./echarts.min.js" async></script>
  <style>
    :root {
      --ink: #10140f;
      --pine: #1a241c;
      --paper: #f1e6cf;
      --rule: #cbb992;
      --vermilion: #c43c2c;
      --moss: #2f6b4f;
      --amber: #d7a04b;
      --mute: #7a715f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0d110e; color: var(--paper); }
    body {
      font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
      background-image:
        radial-gradient(1000px 420px at 8% -8%, #243028 0%, transparent 55%),
        linear-gradient(180deg, #141a16, #0d110e);
    }
    .frame { max-width: 1080px; margin: 0 auto; padding: 24px 18px 56px; }
    header {
      display: flex; justify-content: space-between; gap: 16px; align-items: end;
      border-bottom: 1px solid rgba(241,230,207,.18); padding-bottom: 16px;
    }
    .kicker { font-family: "IBM Plex Mono", monospace; letter-spacing: .2em; font-size: 11px; color: var(--amber); }
    h1 { font-family: "Fraunces", "Noto Serif SC", serif; font-size: clamp(28px, 5vw, 46px); margin: 6px 0 0; letter-spacing: -.03em; }
    .asof { font-family: "IBM Plex Mono", monospace; font-size: 13px; text-align: right; }
    .asof b { display: block; font-family: "Fraunces", serif; font-size: 22px; color: #fff; }
    .banner {
      margin: 16px 0 12px; padding: 12px 14px;
      background: rgba(215,160,75,.1); border: 1px solid rgba(215,160,75,.28);
      color: #f0dfb8; font-size: 14px; line-height: 1.7;
    }
    .view {
      background: var(--paper); color: var(--ink); padding: 12px 16px;
      box-shadow: 8px 12px 0 rgba(0,0,0,.28); margin: 16px 0 22px;
    }
    .view .body { font-size: 15px; line-height: 1.8; margin: 0; }
    .card {
      background: var(--paper); color: var(--ink); padding: 16px 16px 12px;
      box-shadow: 8px 12px 0 rgba(0,0,0,.28); margin-bottom: 22px;
    }
    .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .code { font-family: "IBM Plex Mono", monospace; color: var(--mute); font-size: 12px; }
    .name { margin: 0; font-size: 22px; }
    .px { font-family: "Fraunces", serif; font-size: 34px; letter-spacing: -.04em; }
    .four {
      display: grid; grid-template-columns: .9fr 1.05fr 1.25fr 1.35fr;
      gap: 8px 14px; margin: 14px 0 12px; align-items: start;
    }
    .flab { font-size: 11px; color: #5c5648; letter-spacing: .12em; margin-bottom: 6px; }
    .fval { font-size: 16px; line-height: 1.35; font-weight: 700; }
    .pwindow { display: block; margin-top: 2px; color: #6d6454; font-size: 11px; font-weight: 500; line-height: 1.45; }
    .shape-summary-status { margin-top: 4px; }
    .transition-summary { color: #8a5a22; }
    .fzone { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: #8a5a22; margin-top: 4px; font-weight: 500; }
    .block { margin: 0 0 16px; }
    .block-k {
      font-size: 14px; font-weight: 700; letter-spacing: .08em; color: #3d382c;
      margin: 16px 0 10px; padding-top: 10px;
      border-top: 1px solid rgba(61,56,44,.38);
    }
    .fbound { margin-top: 6px; font-size: 12px; line-height: 1.45; }
    .ftrig { margin-right: 8px; font-weight: 600; color: #3d382c; }
    .fpx { font-family: "IBM Plex Mono", monospace; color: #3d382c; }
    .pathgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
    .pathcol > b { display: block; margin-bottom: 8px; font-size: 14px; }
    .pathcell { border: 1px solid transparent; padding: 8px 8px 10px; margin-bottom: 6px; }
    .pathcell.sup { background: rgba(196,60,44,.04); }
    .pathcell.res { background: rgba(47,107,79,.04); }
    .pathcell.focus { outline: 2px solid #b88732; background: rgba(215,160,75,.12); }
    .pathcell.empty { color: var(--mute); font-size: 12px; }
    .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .htag {
      font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .14em;
      color: #8a8270; padding: 0;
    }
    .pathcell.sup .role, .pathcell.sup .pz { color: #b3261e; }
    .pathcell.res .role, .pathcell.res .pz { color: #24724d; }
    .role { font-size: 12px; }
    .pz { font-family: "IBM Plex Mono", monospace; font-size: 16px; margin: 2px 0 6px; }
    .pa { font-size: 13px; color: #3d382c; }
    .struct-state { margin: 2px 0 12px; padding: 8px 10px; border-left: 3px solid #b88732; background: rgba(215,160,75,.08); color: #5d513b; font-size: 12px; line-height: 1.55; }
    .bull { color: #b3261e; } .bear { color: #24724d; } .neutral { color: #8a8270; } .gold { color: #b88732; }
    .confirm { margin: 0 0 14px; }
    .confirm .row {
      display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
      padding: 10px 12px; margin: 0 0 6px; font-size: 14px; line-height: 1.6;
    }
    .confirm .row:last-child { margin: 0; }
    .confirm .row.dir { border-left: 4px solid #8a8270; background: rgba(16,20,15,.04); }
    .confirm .row.dir.bear { border-left-color: #24724d; background: rgba(47,107,79,.08); }
    .confirm .row.dir.bull { border-left-color: #b3261e; background: rgba(196,60,44,.08); }
    .confirm .row.env { border-left: 4px solid #b88732; background: rgba(215,160,75,.10); }
    .kind { color: var(--mute); font-size: 12px; letter-spacing: .08em; min-width: 56px; }
    .badge { font-weight: 700; min-width: 72px; flex: 0 0 auto; }
    .indline { display: flex; flex-wrap: wrap; gap: 6px 0; align-items: center; }
    .indline span { font-family: "IBM Plex Mono", monospace; font-size: 12px; margin-right: 4px; font-weight: 400; }
    .indline span.bull, .indline span.bear, .indline span.gold { font-weight: 700; }
    .evidence { margin: 8px 0 0; font-size: 12px; color: #6d6454; }
    .tools, .layers { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; align-items: center; }
    .tools button, .layers button {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      border: 1px solid var(--rule); background: transparent; padding: 3px 8px; cursor: pointer;
    }
    .tools button.on, .layers button.on { background: var(--ink); color: var(--paper); }
    .layers button.solo { background: var(--vermilion); color: #fff; border-color: var(--vermilion); }
    .layers .hint { font-size: 11px; color: var(--mute); }
    .chart { height: 740px; width: 100%; position: relative; }
    .chart:empty::before {
      content: "正在画图…";
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #6d6454; font-size: 13px;
    }
    .note { font-size: 12px; color: #6d6454; margin: 6px 0 0; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--mute); margin-top: 8px; min-height: 18px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend .sw { width: 14px; height: 3px; display: inline-block; }
    .legend .sw.dash { height: 0; border-top: 2px dashed; background: none !important; width: 16px; }
    .legend .sw.band { height: 8px; width: 12px; opacity: .55; }
    .hist h2 { font-size: 18px; }
    .rail { display: flex; gap: 10px; overflow-x: auto; }
    .pill { min-width: 220px; background: var(--pine); border: 1px solid rgba(241,230,207,.16); padding: 10px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.55; }
    .pill .d { color: var(--amber); margin-bottom: 4px; }
    footer { margin-top: 24px; color: var(--mute); font-size: 12px; font-family: "IBM Plex Mono", monospace; line-height: 1.6; }
    @media (max-width: 720px) {
      header, .head { display: block; }
      .asof { text-align: left; margin-top: 8px; }
      .four, .pathgrid { grid-template-columns: 1fr 1fr; }
      .ffocus { grid-column: 1 / -1; }
      .chart { height: 680px; }
      .px { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <div>
        <div class="kicker">CGB Futures Desk</div>
        <h1>国债期货技术面</h1>
      </div>
      <div class="asof"><b id="asof">—</b><div id="source"></div></div>
    </header>
    <div class="banner" id="banner">正在加载结论…</div>
    <section class="view" id="view" hidden></section>
    <article class="card" id="card-T"><p class="note">正在写入 T 结论…</p></article>
    <article class="card" id="card-TL"><p class="note">正在写入 TL 结论…</p></article>
    <section class="hist">
      <h2>连续变化</h2>
      <div class="rail" id="rail"></div>
    </section>
    <footer id="foot"></footer>
  </div>
  <script src="./data.js"></script>
  <script>
    const D = window.DESK;
    if (!D) {
      document.getElementById("banner").textContent =
        "data.js 没有加载到。请打开同目录下的 index.html，不要只打开编辑器预览。";
    } else {
    const fmt = (n, d) => Number(n).toFixed(d);
    const rng = (a, d) => `${fmt(a[0], d)}–${fmt(a[1], d)}`;
    const PATTERN_LABELS = {};
    document.getElementById("asof").textContent = D.asof;
    document.getElementById("source").textContent = `${D.source} · ${D.codes.T} / ${D.codes.TL}`;
    document.getElementById("banner").style.display = "none";
    const cross = (D.cross_events || []).filter(Boolean);
    const view = document.getElementById("view");
    if (cross.length) {
      view.hidden = false;
      view.innerHTML = `<p class="body"><b>跨品种观察：</b>${cross.join(" ")}</p>`;
    } else {
      view.hidden = true;
      view.innerHTML = "";
    }

    function indTone(name, val) {
      if (name === "KDJ" && /转弱/.test(val)) return "bear";
      if (name === "KDJ" && /转强/.test(val)) return "bull";
      if (name === "KDJ" && /高位|低位/.test(val)) return "gold";
      if (name === "KDJ" && /偏弱/.test(val)) return "bear";
      if (name === "KDJ" && /偏强/.test(val)) return "bull";
      if (name === "MACD" && /明确底|改善|增强/.test(val)) return "bull";
      if (name === "MACD" && /明确顶|衰减/.test(val)) return "bear";
      if (name === "MACD" && /弱/.test(val)) return "gold";
      if (name === "RSI" && /偏高/.test(val)) return "bull";
      if (name === "RSI" && /偏低/.test(val)) return "bear";
      if ((name === "布林" || name === "BOLL") && /收缩|扩张|上轨|下轨/.test(val)) return "gold";
      return "neutral";
    }
    function sameZone(a, b) {
      return a && b && Number(a[0]) === Number(b[0]) && Number(a[1]) === Number(b[1]);
    }
    function cell(item, horizon, role, d, focusZone) {
      if (!item) return `<div class="pathcell empty">${horizon}｜${horizon === "结构路径" ? "暂无已确认结构位置" : "暂无" + role}</div>`;
      role = (item.roles && item.roles[0]) || role;
      const source = { daily: "日线", "15m": "15分钟", "daily+15m": "日线+15分钟共振" }[item.source_tag] || "日线";
      const side = /支撑/.test(role) ? "sup" : "res";
      const focus = sameZone(item.zone, focusZone) ? " focus" : "";
      return `<div class="pathcell ${side}${focus}">
        <div class="ph"><span class="htag">${horizon}</span><span class="role">${role}</span></div>
        <div class="pz">${rng(item.zone, d)}</div>
        <div class="pa">${source}${item.action ? "｜" + item.action : ""}</div>
      </div>`;
    }
    function pathCells(near, structural, nearHorizon, nearRole, d, focusZone) {
      if (near && structural && sameZone(near.zone, structural.zone)) {
        const role = (near.roles && near.roles[0]) || nearRole;
        return cell(
          { ...near, roles: [role], action: "兼具近端位置 + 当前结构路径" },
          "关键", role, d, focusZone
        );
      }
      return cell(near, nearHorizon, nearRole, d, focusZone)
        + cell(structural, "结构路径", /支撑/.test(nearRole) ? "结构支撑" : "结构压力", d, focusZone);
    }
    function structureStateLine(spec, d) {
      const events = spec.structural_break_events || [];
      const event = events.find(x => x.active);
      if (!event) return "";
      const isSupport = event.direction === "down";
      const references = spec.structural_reference || {};
      const paths = spec.structural_path_current || {};
      const reference = isSupport ? references.support : references.resistance;
      const path = isSupport ? paths.support : paths.resistance;
      const action = isSupport ? "确认跌破" : "确认突破";
      const former = reference && reference.zone ? `原结构${isSupport ? "支撑" : "压力"} ${rng(reference.zone, d)} ${action}` : `原结构${isSupport ? "支撑" : "压力"}${action}`;
      const next = path && path.zone ? `当前${isSupport ? "下行" : "上行"}路径：${rng(path.zone, d)}` : `${isSupport ? "下方" : "上方"}暂无已确认结构位置`;
      return `<div class="struct-state">状态切换｜${former}；${next}</div>`;
    }
    function tones(spec) {
      return spec.layer_tones || {};
    }
    function boundLine(b) {
      if (!b || !b.trigger) return "";
      return `<div class="fbound" title="${(b.tooltip || "").replace(/"/g, "&quot;")}"><span class="ftrig">${b.trigger}</span><span class="fpx">${b.price || ""}</span></div>`;
    }
    function transitionLine(summary) {
      return summary ? `<div class="pwindow transition-summary">${summary}</div>` : "";
    }
    function keyTestLine(spec) {
      const tests = (spec.key_level_tests || []).filter(x => x.test_state);
      if (!tests.length) {
        const reason = spec.intraday_unavailable_reason || spec.key_level_tests_reason;
        const message = {
          missing_prior_snapshot: "15分钟执行快照待建立",
          insufficient_intraday_history: "15分钟历史样本不足",
          contract_mismatch: "分钟合约与执行快照不一致",
          data_incomplete: "当日分钟数据不完整"
        }[reason];
        return message ? `<div class="pwindow">${message}</div>` : "";
      }
      const rank = { false_break: 0, break_extension: 1, retest: 2, repeated_test: 3, initial_reaction: 4, testing: 5, approaching: 6 };
      const x = tests.slice().sort((a, b) => (rank[a.test_state] ?? 9) - (rank[b.test_state] ?? 9))[0];
      const support = /support/.test(x.role || "");
      const role = (x.role || "").replace(/_/g, " ")
        .replace("structural support", "结构支撑").replace("structural resistance", "结构压力")
        .replace("daily near support", "近端支撑").replace("daily near resistance", "近端压力")
        .replace("shape boundary support", "形态边界").replace("shape boundary resistance", "形态边界")
        .replace("direction support", "方向边界").replace("direction resistance", "方向边界");
      const text = {
        false_break: `15分钟${support ? "跌破后快速收回" : "突破后快速回落"}`,
        break_extension: `15分钟${support ? "下破延续" : "上破延续"}`,
        retest: `15分钟${support ? "回抽测试，暂未重新站回" : "回踩测试，暂未重新跌回"}`,
        repeated_test: `15分钟第${x.test_count}次测试`,
        initial_reaction: `15分钟测试后${support ? "初步承接" : "初步承压"}`,
        testing: "15分钟正在测试",
        approaching: "15分钟接近测试"
      }[x.test_state] || "";
      const quality = x.reaction_quality === "weakening" ? `｜${support ? "承接减弱" : "压制减弱"}`
        : x.reaction_quality === "strengthening" ? `｜${support ? "承接增强" : "压制增强"}` : "";
      return text ? `<div class="pwindow">${role}｜${text}${quality}</div>` : "";
    }
    function confirmBlock(spec) {
      const v = spec.indicator_verdict || {};
      const vol = spec.volatility || {};
      if (!v.stance && !vol.show) return "";
      const rows = [];
      if (v.stance) {
        rows.push(`<div class="row dir ${v.tone || ""}"><span class="kind">方向修正</span><span class="badge ${v.tone || "neutral"}">${v.stance}</span><span>${v.note || ""}</span></div>`);
      }
      if (vol.show) {
        rows.push(`<div class="row env"><span class="kind">波动状态</span><span class="badge ${vol.tone || "gold"}">${vol.state}</span><span>${vol.note || ""}</span></div>`);
      }
      return `<div class="confirm">${rows.join("")}</div>`;
    }
    function flowBlock(spec) {
      const part = spec.participation_status || {};
      const label = part.label || "确认状态";
      const stance = part.stance || part.summary || "暂停";
      const note = part.note || spec.participation_note || "量仓暂不参与本次确认。";
      return `<div class="confirm"><div class="row ${part.tone === "bull" ? "dir bull" : part.tone === "gold" ? "env" : "dir"}"><span class="kind">${label}</span><span class="badge ${part.tone || "neutral"}">${stance}</span><span>${note}</span></div></div>`;
    }
    function card(key, spec) {
      const d = key === "TL" ? 2 : 3;
      const focus = spec.focus || {};
      const T = tones(spec);
      const status = spec.indicator_status || {};
      const chips = Object.entries(status).map(([k, v]) => `<span class="${indTone(k, v)}">${k} ${v}</span>`).join('<span class="neutral"> ｜ </span>');
      const path = spec.price_path || {};
      const structuralPath = spec.structural_path_current || {};
      const B = spec.bounds || {};
      return `
        <div class="head">
          <div><div class="code">${spec.code}</div><h2 class="name">${spec.name}</h2></div>
          <div class="px">${fmt(spec.close, d)}</div>
        </div>
        <div class="block">
          <div class="block-k">价格分析｜主判断</div>
          <div class="four">
            <div>
              <div class="flab">中期方向</div>
              <div class="fval dir ${T.direction || ""}">${spec.bias}${spec.direction_status && spec.direction_status !== "完整" ? `<span class="pwindow">${spec.direction_status}</span>` : ""}${spec.direction_phase === "待重建" ? `<span class="pwindow">待重建</span>` : ""}${spec.direction_progress ? `<span class="pwindow">${spec.direction_progress}</span>` : ""}</div>
              ${transitionLine(spec.direction_transition_summary)}
              ${boundLine(B.direction)}
            </div>
            <div>
              <div class="flab">运行形态</div>
              <div class="fval pattern ${T.pattern || ""}">${(spec.display_summary || {}).running_pattern || "结构不清晰"}</div>
              ${(spec.display_summary || {}).status_line ? `<div class="pwindow shape-summary-status">${spec.display_summary.status_line}</div>` : ""}
              ${transitionLine(spec.shape_transition_summary)}
              <div class="fbound">${(spec.display_summary || {}).boundary_line || "形态边界 —"}</div>
            </div>
            <div>
              <div class="flab">行情阶段</div>
              <div class="fval stage ${T.stage || ""}">${spec.stage_label || ""}</div>
              ${transitionLine(spec.stage_transition_summary)}
              ${boundLine(B.stage)}
            </div>
            <div class="ffocus">
              <div class="flab">当前焦点</div>
              <div class="fval ${T.focus || "gold"}">${focus.label || "等待关键区域测试"}</div>
              ${keyTestLine(spec)}
              ${transitionLine(spec.focus_transition_summary)}
              ${boundLine(B.focus)}
            </div>
          </div>
          <div class="pathgrid">
            <section class="pathcol">
              <b>↓ 下行路径</b>
              ${pathCells(path.support_near, structuralPath.support || path.support_structure, "短线", "近端支撑", d, focus.zone)}
            </section>
            <section class="pathcol">
              <b>↑ 上行路径</b>
              ${pathCells(path.resistance_near, structuralPath.resistance || path.resistance_structure, "短线", "近端压力", d, focus.zone)}
            </section>
          </div>
          ${structureStateLine(spec, d)}
        </div>
        <div class="block">
          <div class="block-k">技术指标｜辅助</div>
          ${confirmBlock(spec)}
          <div class="evidence">指标依据　<span class="indline">${chips}</span></div>
        </div>
        <div class="block">
          <div class="block-k">量仓｜辅助</div>
          ${flowBlock(spec)}
        </div>
        <div class="block-k">图表</div>
        <div class="tools" data-key="${key}">
          <button class="on" data-n="60">3月</button>
          <button data-n="120">6月</button>
          <button data-n="250">1年</button>
          <button data-n="9999">全部</button>
        </div>
        <div class="layers" data-key="${key}">
          <button class="on" data-layer="maS" title="MA10 / MA20">短均</button>
          <button data-layer="maL" title="MA60 / MA120">长均</button>
          <button class="on" data-layer="ref" title="通道与失效边界参考线">参考线</button>
          <button class="on" data-layer="band" title="近端支撑 / 压力色带">色带</button>
          <span class="hint">单击开关 · 双击只看这层</span>
        </div>
        <div class="chart" id="ch-${key}"></div>
        <div class="legend" id="lg-${key}"></div>`;
    }
    document.getElementById("card-T").innerHTML = card("T", D.T);
    document.getElementById("card-TL").innerHTML = card("TL", D.TL);

    const charts = {};
    const observers = {};
    const rangeN = { T: 60, TL: 60 };
    const clickWait = {};
    const C = {
      ma10: "#0e7c7b",
      ma20: "#3b6ea5",
      ma60: "#6b4ea1",
      ma120: "#d97706",
      ch: "rgba(154,52,18,.82)",
      invN: "rgba(138,90,34,.78)",
      invT: "rgba(55,52,48,.82)",
      bandS: "rgba(196,60,44,.08)",
      bandR: "rgba(47,107,79,.08)",
      bandSF: "rgba(196,60,44,.16)",
      bandRF: "rgba(47,107,79,.16)",
      structS: "rgba(196,60,44,.48)",
      structR: "rgba(47,107,79,.48)"
    };
    const defaultLayers = () => ({ maS: true, maL: false, ref: true, band: true, solo: null });
    const layers = { T: defaultLayers(), TL: defaultLayers() };

    function layerOn(key, name) {
      const L = layers[key];
      if (L.solo) return L.solo === name;
      return !!L[name];
    }
    function paintLayerButtons(key) {
      const box = document.querySelector(`.layers[data-key="${key}"]`);
      if (!box) return;
      const L = layers[key];
      box.querySelectorAll("button[data-layer]").forEach(btn => {
        const name = btn.dataset.layer;
        btn.classList.toggle("solo", L.solo === name);
        btn.classList.toggle("on", L.solo ? L.solo === name : !!L[name]);
      });
    }
    function nums(xs) {
      return xs.filter(v => v != null && v !== "" && !Number.isNaN(+v)).map(v => +v);
    }
    function shapeBoundaryYs(spec) {
      const ys = [];
      if (spec.shape_boundary_type === "two_sided") {
        if (spec.shape_boundary_lower != null) ys.push(+spec.shape_boundary_lower);
        if (spec.shape_boundary_upper != null) ys.push(+spec.shape_boundary_upper);
      } else if (spec.invalid_near != null) {
        ys.push(+spec.invalid_near);
      } else {
        if (spec.shape_boundary_lower != null) ys.push(+spec.shape_boundary_lower);
        if (spec.shape_boundary_upper != null) ys.push(+spec.shape_boundary_upper);
      }
      return nums(ys);
    }
    function railPrices(rail) {
      if (!Array.isArray(rail)) return [];
      return nums(rail.map(p => Array.isArray(p) ? p[1] : null));
    }
    function legendHtml(key) {
      const item = (cls, color, label) => {
        const style = cls.includes("dash")
          ? `border-color:${color}`
          : `background:${color}`;
        return `<span><i class="sw ${cls}" style="${style}"></i>${label}</span>`;
      };
      const spec = D[key];
      const out = [];
      if (layerOn(key, "band")) {
        out.push(item("band", "rgba(196,60,44,.45)", "近端支撑带"));
        out.push(item("band", "rgba(196,60,44,.22)", "结构支撑区"));
        out.push(item("band", "rgba(47,107,79,.45)", "近端压力带"));
        out.push(item("band", "rgba(47,107,79,.22)", "结构压力区"));
      }
      if (layerOn(key, "ref")) {
        if (spec.trend_lower) out.push(item("dash", C.ch, "通道下沿"));
        if (spec.trend_upper) out.push(item("dash", C.ch, "通道上沿"));
        if (shapeBoundaryYs(spec).length) out.push(item("dash", C.invN, "形态边界"));
        if (spec.invalid_trend != null) out.push(item("dash", C.invT, "方向失效"));
      }
      if (layerOn(key, "maS")) {
        out.push(item("", C.ma10, "MA10"));
        out.push(item("", C.ma20, "MA20"));
      }
      if (layerOn(key, "maL")) {
        out.push(item("", C.ma60, "MA60"));
        out.push(item("", C.ma120, "MA120"));
      }
      return out.join("");
    }
    function slice(bars, n) { return n >= bars.length ? bars : bars.slice(-n); }
    function extendLine(p1, p2, dates) {
      if (!p1 || !p2 || dates.length < 2) return [];
      const x1 = new Date(p1[0]).getTime(), x2 = new Date(p2[0]).getTime();
      if (x2 === x1) return [];
      const slope = (p2[1] - p1[1]) / (x2 - x1);
      return dates.map(d => {
        const x = new Date(d).getTime();
        return +(p1[1] + slope * (x - x1)).toFixed(4);
      });
    }

    function draw(key, n) {
      if (!window.echarts) return;
      if (n) rangeN[key] = n;
      n = rangeN[key];
      paintLayerButtons(key);
      const lg = document.getElementById("lg-" + key);
      if (lg) lg.innerHTML = legendHtml(key);
      const spec = D[key];
      const dec = key === "TL" ? 2 : 3;
      const bars = slice(spec.bars, n);
      const focusBars = bars.slice(-Math.min(40, bars.length));
      const coreZones = Object.values(spec.price_path || {}).filter(Boolean).flatMap(x => x.zone);
      const shapeLines = shapeBoundaryYs(spec);
      const priceVals = nums(focusBars.flatMap(b => [b.low, b.high]).concat(coreZones));
      const nativeMin = Math.min(...priceVals);
      const nativeMax = Math.max(...priceVals);
      const atr = focusBars[focusBars.length - 1]?.atr || (nativeMax - nativeMin) * 0.12;
      const atrPad = atr * 0.5;
      const refLevels = [];
      if (layerOn(key, "ref")) {
        refLevels.push(...shapeLines);
        if (spec.invalid_trend != null) refLevels.push(+spec.invalid_trend);
        refLevels.push(...railPrices(spec.trend_lower), ...railPrices(spec.trend_upper));
      }
      // Keep nearby invalidation / channel rails in frame; far levels get an edge caption instead of crushing the scale.
      const cap = Math.max(4 * atr, (nativeMax - nativeMin) * 0.75);
      const nearbyRef = nums(refLevels).filter(y => y >= nativeMin - cap && y <= nativeMax + cap);
      const focusValues = priceVals.concat(nearbyRef);
      const focusMin = Math.min(...focusValues);
      const focusMax = Math.max(...focusValues);
      const priceMin = focusMin - atrPad;
      const priceMax = focusMax + atrPad;
      const dates = bars.map(b => b.time);
      const candle = bars.map(b => [b.open, b.close, b.low, b.high]);
      const vol = bars.map(b => ({
        value: b.volume,
        itemStyle: { color: b.close >= b.open ? "rgba(196,60,44,.45)" : "rgba(47,107,79,.45)" }
      }));
      const oiMap = Object.fromEntries((spec.oi || []).map(p => [p.time, p.value]));
      const oi = dates.map(d => oiMap[d] ?? null);
      const ma = (f) => bars.map(b => b[f]);
      const area = (lo, hi, color, name, labelColor, side) => ([
        {
          yAxis: lo,
          itemStyle: { color },
          name,
          label: {
            show: Boolean(name),
            position: side || "insideLeft",
            distance: 6,
            color: labelColor || "#3d382c",
            fontSize: 10,
            fontFamily: "IBM Plex Mono, monospace"
          }
        },
        { yAxis: hi }
      ]);
      const edge = (y, color) => ({
        yAxis: y,
        lineStyle: { color, width: 1.3, type: "solid" },
        label: { show: false }
      });
      const showInv = layerOn(key, "ref");
      const showBand = layerOn(key, "band");
      const showCh = layerOn(key, "ref");
      const showMaS = layerOn(key, "maS");
      const showMaL = layerOn(key, "maL");
      const markLine = [];
      const offscreen = [];
      const bandData = [];
      if (showBand) {
        if (spec.support_near) bandData.push(area(spec.support_near[0], spec.support_near[1], C.bandS, "近撑", "#8a1f16", "insideLeft"));
        if (spec.support_far) {
          bandData.push(area(spec.support_far[0], spec.support_far[1], C.bandSF, "结构撑", "#8a1f16", "insideRight"));
          markLine.push(edge(spec.support_far[0], C.structS), edge(spec.support_far[1], C.structS));
        }
        if (spec.resist_near) bandData.push(area(spec.resist_near[0], spec.resist_near[1], C.bandR, "近压", "#1f4d38", "insideLeft"));
        if (spec.resist_far) {
          bandData.push(area(spec.resist_far[0], spec.resist_far[1], C.bandRF, "结构压", "#1f4d38", "insideRight"));
          markLine.push(edge(spec.resist_far[0], C.structR), edge(spec.resist_far[1], C.structR));
        }
      }
      const patName = spec.pattern_label || spec.pattern || "";
      const mid = zone => zone && zone.length === 2 ? (+zone[0] + +zone[1]) / 2 : null;
      const refShort = (side, label) => {
        if (/待确认|进入观察|首次/.test(label || "")) return `${side}·待确认`;
        if (/失败/.test(label || "")) return `${side}·失败`;
        if (/已测试/.test(label || "")) return `${side}·已测试`;
        return side;
      };
      const candidates = [];
      const queueLine = (name, y, color, width, tip, priority) => {
        if (y == null || Number.isNaN(+y)) return;
        y = +y;
        if (y >= priceMin && y <= priceMax) {
          candidates.push({ name, y, color, width, tip, priority });
        } else {
          offscreen.push({ name, y, color, below: y < priceMin });
        }
      };
      if (showInv) {
        const refs = spec.structure_levels || {};
        const same = (a, b) => a && b && +a[0] === +b[0] && +a[1] === +b[1];
        const refS = refs.support_reference;
        const refR = refs.resistance_reference;
        if (refS && !same(refS.zone, spec.support_far)) {
          queueLine(refShort("原撑", refS.label), mid(refS.zone), C.structS, refS.displaced ? 0.8 : 1.15, "原结构支撑仅用于阶段跌破确认，不作为当前下行路径。", 1);
        }
        if (refR && !same(refR.zone, spec.resist_far)) {
          queueLine(refShort("原压", refR.label), mid(refR.zone), C.structR, refR.displaced ? 0.8 : 1.15, "原结构压力仅用于阶段突破确认，不作为当前上行路径。", 1);
        }
        shapeLines.forEach(y => {
          queueLine("形态边界", y, C.invN, 1.3, `形态边界 ${fmt(y, dec)}<br>当前形态：${patName}`, 3);
        });
        if (spec.invalid_trend != null) {
          queueLine(
            "方向失效", spec.invalid_trend, C.invT, 1.5,
            `方向失效 ${fmt(spec.invalid_trend, dec)}<br>当前中期方向：${spec.bias}`, 3
          );
        }
      }
      const minGap = Math.max(atr * 0.45, (priceMax - priceMin) * 0.055);
      const placed = [];
      candidates.slice().sort((a, b) => b.priority - a.priority || b.y - a.y).forEach(item => {
        const clash = placed.find(k => Math.abs(k.y - item.y) < minGap);
        if (clash) {
          if (item.priority < clash.priority) return;
          if (item.priority === clash.priority && Math.abs(clash.y - item.y) < minGap * 0.5) return;
          item.position = item.y >= clash.y ? "insideEndTop" : "insideEndBottom";
          clash.position = item.y >= clash.y ? "insideEndBottom" : "insideEndTop";
        }
        item.position = item.position || "insideEnd";
        placed.push(item);
      });
      placed.forEach(item => {
        markLine.push({
          name: item.name,
          yAxis: item.y,
          label: {
            formatter: item.name,
            position: item.position || "insideEnd",
            color: item.color,
            fontSize: 10,
            distance: 4
          },
          lineStyle: { color: item.color, width: item.width, type: "dashed" },
          tooltip: { formatter: item.tip }
        });
      });
      const railSeries = (name, rail) => ({
        name, type: "line", xAxisIndex: 0, yAxisIndex: 0, clip: true, z: 8,
        data: extendLine(rail[0], rail[1], dates),
        showSymbol: false,
        lineStyle: { color: C.ch, width: 1.8, type: "dashed" },
        endLabel: { show: false },
        label: { show: false },
        tooltip: { show: false }
      });
      const trendSeries = [];
      if (showCh && spec.trend_lower) trendSeries.push(railSeries("通道下沿", spec.trend_lower));
      if (showCh && spec.trend_upper) trendSeries.push(railSeries("通道上沿", spec.trend_upper));

      const el = document.getElementById("ch-" + key);
      if (charts[key]) charts[key].dispose();
      const chart = echarts.init(el, null, { renderer: "canvas" });
      const plotLeft = 68;
      const plotRight = 52;
      const gPrice = { left: plotLeft, right: plotRight, top: 20, height: 300, containLabel: false };
      const gMacd = { left: plotLeft, right: plotRight, top: 360, height: 90, containLabel: false };
      const gVol = { left: plotLeft, right: plotRight, top: 472, height: 70, containLabel: false };
      const gOi = { left: plotLeft, right: plotRight, top: 564, height: 82, containLabel: false };
      chart.setOption({
        animation: false,
        backgroundColor: "#f1e6cf",
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "cross" },
          backgroundColor: "#201c16",
          borderWidth: 0,
          textStyle: { color: "#f1e6cf", fontSize: 12 },
          formatter(params) {
            const p = params.filter(x => x.seriesName === "K线")[0];
            if (!p) return "";
            const i = p.dataIndex;
            const b = bars[i];
            const oiV = oi[i];
            const macd = b.macd_hist != null ? `<br>MACD柱 ${Number(b.macd_hist).toFixed(4)}` : "";
            const rsi = b.rsi != null ? `  RSI ${Number(b.rsi).toFixed(1)}` : "";
            const kdj = b.k != null && b.d != null
              ? `<br>KDJ ${Number(b.k).toFixed(1)} / ${Number(b.d).toFixed(1)} / ${Number(b.j).toFixed(1)}${b.k < b.d ? " 偏弱" : b.k > b.d ? " 偏强" : ""}`
              : "";
            const boll = b.boll_state
              ? `<br>布林 ${b.boll_state}${b.boll_pct != null ? ` 分位${b.boll_pct}%` : ""}`
              : "";
            return `${b.time}<br>开 ${b.open}  高 ${b.high}<br>低 ${b.low}  收 ${b.close}<br>成交量 ${Math.round(b.volume)} 手`
              + (oiV != null ? `<br>持仓 ${Math.round(oiV)} 手` : "")
              + macd + rsi + kdj + boll;
          }
        },
        axisPointer: { link: [{ xAxisIndex: [0, 1, 2, 3] }] },
        graphic: [
          { type: "text", left: plotLeft + 4, top: gMacd.top + 2, style: { text: "MACD", fill: "#6d6454", fontSize: 11, fontFamily: "IBM Plex Mono, monospace" } },
          { type: "text", left: plotLeft + 4, top: gVol.top + 2, style: { text: "成交量", fill: "#6d6454", fontSize: 11, fontFamily: "IBM Plex Mono, monospace" } },
          { type: "text", left: plotLeft + 4, top: gOi.top + 2, style: { text: "持仓量", fill: "#6d6454", fontSize: 11, fontFamily: "IBM Plex Mono, monospace" } },
          ...offscreen.map((item, i) => ({
            type: "text",
            left: plotLeft + 8,
            top: item.below
              ? gPrice.top + gPrice.height - 16 - i * 14
              : gPrice.top + 4 + i * 14,
            style: {
              text: `${item.name} ${fmt(item.y, dec)} ${item.below ? "↓" : "↑"}`,
              fill: item.color,
              fontSize: 11,
              fontFamily: "IBM Plex Mono, monospace",
              fontWeight: 600
            }
          }))
        ],
        grid: [gPrice, gMacd, gVol, gOi],
        xAxis: [
          { type: "category", data: dates, gridIndex: 0, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#cbb992" } } },
          { type: "category", data: dates, gridIndex: 1, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#cbb992" } } },
          { type: "category", data: dates, gridIndex: 2, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { lineStyle: { color: "#cbb992" } } },
          { type: "category", data: dates, gridIndex: 3, axisLabel: { color: "#6d6454", fontSize: 10, hideOverlap: true }, axisLine: { lineStyle: { color: "#cbb992" } } }
        ],
        yAxis: [
          { min: priceMin, max: priceMax, gridIndex: 0, splitNumber: 5, axisLabel: { color: "#3d382c", fontFamily: "IBM Plex Mono", fontSize: 10, align: "right", margin: 8, formatter: v => v.toFixed(dec) }, splitLine: { lineStyle: { color: "rgba(16,20,15,.08)" } } },
          { scale: true, gridIndex: 1, splitNumber: 3, axisLabel: { color: "#6d6454", fontFamily: "IBM Plex Mono", fontSize: 10, align: "right", margin: 8 }, splitLine: { show: false } },
          { min: 0, scale: false, gridIndex: 2, splitNumber: 2, axisLabel: { color: "#6d6454", fontFamily: "IBM Plex Mono", fontSize: 10, align: "right", margin: 8, formatter: v => (v/1000).toFixed(0) + "千" }, splitLine: { show: false } },
          { scale: true, gridIndex: 3, splitNumber: 3, axisLabel: { color: "#6d6454", fontFamily: "IBM Plex Mono", fontSize: 10, align: "right", margin: 8, formatter: v => (v/10000).toFixed(1) + "万" }, splitLine: { show: false } }
        ],
        series: [
          {
            name: "K线", type: "candlestick", data: candle, xAxisIndex: 0, yAxisIndex: 0, clip: true,
            itemStyle: { color: "#c43c2c", color0: "#2f6b4f", borderColor: "#c43c2c", borderColor0: "#2f6b4f" },
            markArea: {
              silent: true,
              label: { show: true, position: "insideLeft" },
              data: bandData
            },
            markLine: { symbol: "none", silent: true, data: markLine }
          },
          ...(showMaS ? [
            { name: "MA10", type: "line", data: ma("ma10"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma10, width: 1.6 } },
            { name: "MA20", type: "line", data: ma("ma20"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma20, width: 1.8 } }
          ] : []),
          ...(showMaL ? [
            { name: "MA60", type: "line", data: ma("ma60"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma60, width: 1.3 } },
            { name: "MA120", type: "line", data: ma("ma120"), xAxisIndex: 0, yAxisIndex: 0, clip: true, showSymbol: false, lineStyle: { color: C.ma120, width: 1.3 } }
          ] : []),
          ...trendSeries,
          {
            name: "MACD柱", type: "bar", data: bars.map(b => ({
              value: b.macd_hist,
              itemStyle: { color: (b.macd_hist || 0) >= 0 ? "rgba(196,60,44,.55)" : "rgba(47,107,79,.55)" }
            })),
            xAxisIndex: 1, yAxisIndex: 1, barWidth: "60%"
          },
          { name: "DIF", type: "line", data: ma("dif"), xAxisIndex: 1, yAxisIndex: 1, showSymbol: false, lineStyle: { color: "#3b6ea5", width: 1 } },
          { name: "DEA", type: "line", data: ma("dea"), xAxisIndex: 1, yAxisIndex: 1, showSymbol: false, lineStyle: { color: "#8a5a22", width: 1 } },
          { name: "成交量", type: "bar", data: vol, xAxisIndex: 2, yAxisIndex: 2, barWidth: "60%" },
          {
            name: "持仓", type: "line", data: oi, xAxisIndex: 3, yAxisIndex: 3,
            showSymbol: false, connectNulls: false, lineStyle: { color: "#8a5a22", width: 2 },
            areaStyle: { color: "rgba(138,90,34,.12)" },
            markArea: D.roll_start ? {
              silent: true,
              itemStyle: { color: "rgba(196,60,44,.12)" },
              data: [[{ xAxis: D.roll_start, name: "换月" }, { xAxis: dates[dates.length - 1] }]]
            } : undefined
          }
        ]
      }, { notMerge: true });
      if (observers[key]) observers[key].disconnect();
      observers[key] = new ResizeObserver(() => chart.resize());
      observers[key].observe(el);
      charts[key] = chart;
    }

    document.querySelectorAll(".tools").forEach(box => {
      box.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        box.querySelectorAll("button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        draw(box.dataset.key, Number(btn.dataset.n));
      });
    });
    document.querySelectorAll(".layers").forEach(box => {
      const key = box.dataset.key;
      box.addEventListener("click", e => {
        const btn = e.target.closest("button[data-layer]");
        if (!btn) return;
        const name = btn.dataset.layer;
        clearTimeout(clickWait[key]);
        clickWait[key] = setTimeout(() => {
          const L = layers[key];
          if (L.solo) L.solo = null;
          else L[name] = !L[name];
          draw(key);
        }, 220);
      });
      box.addEventListener("dblclick", e => {
        const btn = e.target.closest("button[data-layer]");
        if (!btn) return;
        e.preventDefault();
        clearTimeout(clickWait[key]);
        const L = layers[key];
        const name = btn.dataset.layer;
        L.solo = L.solo === name ? null : name;
        draw(key);
      });
    });

    function md(asof) {
      const p = String(asof).split("-");
      return p.length === 3 ? `${p[1]}/${p[2]}` : asof;
    }
    function layerName(spec) {
      return spec.pattern_label || PATTERN_LABELS[spec.pattern] || spec.pattern || "";
    }
    function histLines(prev, cur, key) {
      if (!cur) return [];
      const lines = [];
      const add = (name, a, b) => {
        if (b == null || b === "" || a == null || a === "") return;
        if (String(a) !== String(b)) lines.push(`${name}：${a} → ${b}`);
      };
      add("中期方向", prev && prev.bias, cur.bias);
      add("运行形态", prev && layerName(prev), layerName(cur));
      add("行情阶段", prev && (prev.stage || prev.stage_label), cur.stage || cur.stage_label);
      add("当前焦点", prev && prev.focus, cur.focus);
      add("辅助确认", prev && prev.verdict, cur.verdict);
      add("波动状态", prev && prev.volatility, cur.volatility);
      return lines;
    }
    const rail = document.getElementById("rail");
    const history = D.history || [];
    history.slice().reverse().forEach((h, i, arr) => {
      const prev = arr[i + 1];
      const blocks = ["T", "TL"].map(key => {
        const lines = histLines(prev && prev[key], h[key], key);
        if (!lines.length) return "";
        const recal = h[key] && h[key].state_change_reason === "roll_recalibration";
        const oldContract = prev && prev[key] && prev[key].analysis_contract;
        const newContract = h[key] && h[key].analysis_contract;
        const contractText = oldContract || newContract
          ? `（${oldContract || "原序列"} → ${newContract || "未知合约"}）`
          : "";
        const reason = recal ? ` · 换月重估${contractText}` : " · 市场事件";
        return `<div><div class="d">${md(h.asof)} ${key}${reason}</div>${lines.join("<br>")}</div>`;
      }).filter(Boolean);
      if (!blocks.length) return;
      const el = document.createElement("div");
      el.className = "pill";
      el.innerHTML = blocks.join("<br>");
      rail.appendChild(el);
    });
    if (!rail.children.length) {
      rail.textContent = "尚无层级变化可显示。";
    }
    document.getElementById("foot").textContent =
      `${D.roll_note} 数据来源于万得 Wind 金融数据服务。`;

    function bootCharts() {
      if (!window.echarts) {
        document.getElementById("foot").textContent = "图表库 echarts.min.js 未加载，结论文字仍可用。";
        return;
      }
      try { draw("T", 60); draw("TL", 60); }
      catch (err) { document.getElementById("foot").textContent = "画图失败：" + err.message; }
    }
    if (window.echarts) {
      bootCharts();
    } else {
      const existing = document.querySelector('script[src*="echarts.min.js"]');
      const fail = () => {
        document.getElementById("foot").textContent = "图表库 echarts.min.js 未加载，结论文字仍可用。";
      };
      if (existing && existing.readyState === "complete") {
        fail();
      } else if (existing) {
        existing.addEventListener("load", bootCharts);
        existing.addEventListener("error", fail);
      } else {
        const s = document.createElement("script");
        s.src = "./echarts.min.js";
        s.addEventListener("load", bootCharts);
        s.addEventListener("error", fail);
        document.body.appendChild(s);
      }
    }
    } // end DESK present
  </script>
</body>
</html>
